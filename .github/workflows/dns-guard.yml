# DNS guard — makes sure montree.xyz never goes DNS-only (grey cloud) again.
#
# WHY THIS EXISTS: on Sep 4 2026 the montree.xyz apex Cloudflare record was found
# switched to "DNS only" (grey cloud), which exposed Railway's raw edge address and
# made the site completely unreachable from mainland China for hours. Nobody noticed
# until a user reported it. Full incident: docs/handoffs/HANDOFF_2026-09-04_DNS_CHINA_OUTAGE.md
# Policy (do not change without reading that doc first): docs/DNS_ERROR_1034_FIX.md
#
# WHAT THIS WORKFLOW DOES, every 30 minutes (+ manual "Run workflow" button):
#   1. Resolves montree.xyz's A records via a public DNS resolver and checks they
#      fall inside Cloudflare's published IP ranges (i.e. the record is Proxied).
#   2. Requests https://montree.xyz/montree and checks it answers 200 with a
#      `server: cloudflare` response header (belt-and-suspenders on top of step 1).
#   3. IF (and only if) both repo secrets below are configured, AND the DNS check
#      failed, it tries to auto-heal: call the Cloudflare API and flip the record's
#      `proxied` flag back to true, then re-check.
#   4. If the site is still unhealthy at the end, the job FAILS — which makes GitHub
#      email the repo owner automatically. No secrets are required for the alert to
#      work; they are only required for the auto-heal attempt.
#
# TO ENABLE AUTO-HEAL (optional — the health check + email alert work without this):
#   Settings → Secrets and variables → Actions → New repository secret, add:
#     CLOUDFLARE_API_TOKEN  — a Cloudflare API token with "Zone → DNS → Edit"
#                              permission scoped to the montree.xyz zone.
#     CLOUDFLARE_ZONE_ID    — the Zone ID for montree.xyz, shown on the zone's
#                              Cloudflare dashboard Overview page.
#   Without these two secrets, this workflow still checks and still alerts by
#   email on failure — it just won't attempt to fix the record itself.

name: DNS guard (montree.xyz must stay Cloudflare-proxied)

on:
  schedule:
    - cron: '*/30 * * * *' # every 30 minutes
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Resolve montree.xyz A records
        id: resolve
        run: |
          set -e
          IPS=$(dig +short montree.xyz A @1.1.1.1 | tr '\n' ' ')
          echo "Resolved: $IPS"
          echo "ips=$IPS" >> "$GITHUB_OUTPUT"

      - name: Check resolved IPs are inside Cloudflare's ranges (i.e. Proxied)
        id: dns_check
        run: |
          cat > /tmp/check_cf_range.py << 'PYEOF'
          import ipaddress
          import sys
          import urllib.request

          ips_raw = sys.argv[1].split()
          if not ips_raw:
              print("No A records resolved at all — treating as UNHEALTHY.")
              sys.exit(1)

          fallback_ranges = [
              "104.16.0.0/13",
              "104.24.0.0/14",
              "172.64.0.0/13",
          ]

          try:
              with urllib.request.urlopen("https://www.cloudflare.com/ips-v4", timeout=10) as resp:
                  text = resp.read().decode("utf-8")
              ranges = [line.strip() for line in text.splitlines() if line.strip()]
              if not ranges:
                  raise ValueError("empty ips-v4 response")
              source = "cloudflare.com/ips-v4"
          except Exception as e:
              print(f"Could not fetch live Cloudflare ranges ({e}); using hard-coded fallback list.")
              ranges = fallback_ranges
              source = "hard-coded fallback"

          networks = [ipaddress.ip_network(r) for r in ranges]
          print(f"Checking against {len(networks)} Cloudflare ranges (source: {source})")

          all_ok = True
          for ip_str in ips_raw:
              try:
                  ip = ipaddress.ip_address(ip_str)
              except ValueError:
                  print(f"  {ip_str}: not a valid IP, skipping")
                  continue
              in_cf = any(ip in net for net in networks)
              print(f"  {ip_str}: {'OK (Cloudflare)' if in_cf else 'NOT CLOUDFLARE'}")
              if not in_cf:
                  all_ok = False

          sys.exit(0 if all_ok else 1)
          PYEOF
          if python3 /tmp/check_cf_range.py "${{ steps.resolve.outputs.ips }}"; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check HTTPS response is served through Cloudflare
        id: http_check
        run: |
          set +e
          RESPONSE=$(curl -sSI --max-time 20 https://montree.xyz/montree)
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -qi "^HTTP.*200" && \
          echo "$RESPONSE" | grep -qi "^server: *cloudflare"
          if [ $? -eq 0 ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-heal — flip montree.xyz back to Proxied via Cloudflare API
        id: heal
        if: steps.dns_check.outputs.healthy == 'false' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ZONE_ID != ''
        run: |
          set -e
          echo "DNS check failed and Cloudflare credentials are present — attempting auto-heal."

          cat > /tmp/extract_unproxied_ids.py << 'PYEOF'
          import json
          import sys

          data = json.load(sys.stdin)
          for r in data.get("result", []):
              if r.get("proxied") is False:
                  print(r["id"])
          PYEOF

          find_and_fix () {
            local record_type="$1"
            local records
            records=$(curl -sS -X GET \
              "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/dns_records?type=${record_type}&name=montree.xyz" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json")
            echo "Lookup (${record_type}): $records"

            local ids
            ids=$(echo "$records" | python3 /tmp/extract_unproxied_ids.py)
            for id in $ids; do
              echo "Flipping record $id ($record_type) to proxied=true"
              curl -sS -X PATCH \
                "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/dns_records/${id}" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data '{"proxied":true}'
              echo ""
            done
          }

          find_and_fix "CNAME"
          find_and_fix "A"

          echo "Waiting 15s for the change to take effect before re-checking..."
          sleep 15

      - name: Re-check DNS after auto-heal attempt
        id: recheck
        if: steps.heal.outcome == 'success'
        run: |
          IPS=$(dig +short montree.xyz A @1.1.1.1 | tr '\n' ' ')
          echo "Re-resolved: $IPS"
          if python3 /tmp/check_cf_range.py "$IPS"; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail the job if montree.xyz is still unhealthy (triggers GitHub email alert)
        if: steps.dns_check.outputs.healthy == 'false' || steps.http_check.outputs.healthy == 'false'
        run: |
          if [ "${{ steps.recheck.outputs.healthy }}" = "true" ]; then
            echo "Auto-heal succeeded — DNS is healthy again after the fix. Not failing the job."
            exit 0
          fi
          echo "::error::montree.xyz DNS/HTTPS check FAILED — the apex record may have been"
          echo "::error::switched to DNS-only (grey cloud), which blocks mainland China."
          echo "::error::See docs/DNS_ERROR_1034_FIX.md and docs/handoffs/HANDOFF_2026-09-04_DNS_CHINA_OUTAGE.md"
          echo "::error::Fix: Cloudflare dashboard -> DNS -> Records -> montree.xyz -> set Proxied (orange cloud)."
          exit 1
