<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Montree Milestones — Discovery Time</title>
<style>
:root{
  --cream:#FBF6EC; --paper:#FFFDF8; --ink:#2B2A26; --ink-soft:#5C574C;
  --forest:#2F5D3A; --forest-d:#234A2C; --moss:#7C9A63; --clay:#C4744B;
  --sand:#EADCC2; --sand-d:#D9C7A5; --sky:#7FA9C4; --gold:#D8A24A;
  --line:rgba(43,42,38,.14); --shadow:0 2px 0 rgba(43,42,38,.07);
  --r:22px; --tap:96px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--cream); color:var(--ink);
  font-family:"Avenir Next","Segoe UI",Verdana,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:18px; line-height:1.45;
  touch-action:manipulation; -webkit-touch-callout:none;
  user-select:none; -webkit-user-select:none;
  overscroll-behavior:none;
}
input,textarea{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;touch-action:manipulation}
h1,h2,h3{font-family:Georgia,"Songti SC",serif;font-weight:600;margin:0 0 .4em;line-height:1.2}
h1{font-size:1.9rem} h2{font-size:1.35rem} h3{font-size:1.08rem}
p{margin:0 0 .7em}
.app{min-height:100%;display:flex;flex-direction:column}
.wrap{max-width:1100px;margin:0 auto;padding:20px 22px 40px;width:100%}
.muted{color:var(--ink-soft)}
.small{font-size:.85rem}
.tiny{font-size:.75rem}

/* ---------- teacher chrome ---------- */
.tbar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:8px 14px;background:rgba(255,253,248,.9);
  border-bottom:1px solid var(--line);
  padding-top:calc(8px + env(safe-area-inset-top));
  font-size:.82rem;color:var(--ink-soft);
}
.tbar .grow{flex:1}
.chipbtn{
  border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--paper);
  font-size:.82rem;min-height:38px;
}
.chipbtn.on{background:var(--forest);color:#fff;border-color:var(--forest)}
.dots{display:flex;gap:5px;align-items:center;flex-wrap:wrap;max-width:340px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--sand-d)}
.dot.done{background:var(--moss)}
.dot.now{background:var(--forest);transform:scale(1.35)}
.dot.skip{background:transparent;border:1.5px solid var(--sand-d)}

/* ---------- cards / forms ---------- */
.card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 22px;margin:0 0 18px;box-shadow:var(--shadow);
}
.card.warm{background:#FDF6E7;border-color:var(--sand-d)}
.card.quiet{background:transparent;box-shadow:none}
label.f{display:block;margin:0 0 16px}
label.f > span{display:block;font-size:.85rem;color:var(--ink-soft);margin-bottom:6px}
input[type=text],input[type=number],textarea,select{
  width:100%;padding:14px 16px;border:1px solid var(--sand-d);border-radius:14px;
  background:var(--paper);font:inherit;min-height:52px;
}
textarea{min-height:80px;line-height:1.4}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row > *{flex:1 1 220px}
.seg{display:flex;gap:10px;flex-wrap:wrap}
.seg button{
  flex:1 1 auto;min-width:92px;min-height:64px;border-radius:16px;
  border:2px solid var(--sand-d);background:var(--paper);padding:10px 14px;font-weight:600;
}
.seg button.on{background:var(--forest);border-color:var(--forest);color:#fff}
.opt-check{
  display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;
  border:2px solid var(--sand-d);background:var(--paper);margin-bottom:10px;width:100%;text-align:left;
  min-height:72px;
}
.opt-check.on{border-color:var(--forest);background:#F2F6EE}
.opt-check .box{
  width:30px;height:30px;border-radius:9px;border:2px solid var(--sand-d);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-weight:700;color:#fff;
}
.opt-check.on .box{background:var(--forest);border-color:var(--forest)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:64px;padding:14px 30px;border-radius:18px;background:var(--forest);color:#fff;
  font-weight:600;font-size:1.05rem;border:2px solid var(--forest);
}
.btn.ghost{background:var(--paper);color:var(--ink);border-color:var(--sand-d)}
.btn.clay{background:var(--clay);border-color:var(--clay)}
.btn:disabled{opacity:.45}
.btn.wide{width:100%}
.actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.note{border-left:4px solid var(--gold);background:#FDF6E7;padding:12px 16px;border-radius:0 14px 14px 0;margin:0 0 16px;font-size:.9rem}

/* ---------- guide character ---------- */
.guide{width:104px;height:104px;flex:0 0 auto}
.guide.big{width:180px;height:180px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes cheer{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.guide.bob{animation:bob 3.2s ease-in-out infinite}
.guide.cheer{animation:cheer 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.guide{animation:none!important}}

/* ---------- child item screen ---------- */
.stage{flex:1;display:flex;flex-direction:column;padding:14px 18px 26px;max-width:1240px;margin:0 auto;width:100%}
.prompt-row{display:flex;align-items:center;gap:18px;margin:6px 0 14px}
.prompt-txt{flex:1;font-family:Georgia,"Songti SC",serif;font-size:1.25rem;color:var(--ink-soft)}
.speaker{
  width:var(--tap);height:var(--tap);min-width:96px;min-height:96px;border-radius:50%;
  background:var(--sand);border:3px solid var(--sand-d);display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.speaker:active{background:var(--sand-d)}
.speaker svg{width:48px;height:48px}
.options{
  display:grid;gap:24px;grid-template-columns:repeat(2,minmax(0,1fr));flex:1;align-content:center;
}
/* every tap target: at least 96x96 CSS px with at least 24 px of quiet around it */
.optcard{margin:0}
.options.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(orientation:landscape) and (min-width:820px){
  .options{grid-template-columns:repeat(4,minmax(0,1fr))}
  .options.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:560px){ .options{gap:24px} .options.n3{grid-template-columns:repeat(2,minmax(0,1fr))} }
.optcard{
  position:relative;background:var(--paper);border:3px solid var(--sand-d);border-radius:26px;
  min-height:min(38vh,260px);min-width:96px;display:flex;align-items:center;justify-content:center;
  padding:14px;transition:transform .12s ease, box-shadow .12s ease;
}
.optcard svg{width:100%;height:100%;max-height:230px}
.optcard.picked{border-color:var(--moss);box-shadow:0 0 0 6px rgba(124,154,99,.22)}
.optcard.hint{border-color:var(--gold);box-shadow:0 0 0 6px rgba(216,162,74,.22)}
.optcard.soft{opacity:.55}
.optcard .ordbadge{
  position:absolute;top:10px;left:10px;width:40px;height:40px;border-radius:50%;
  background:var(--moss);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;
}
.bigstim{display:flex;align-items:center;justify-content:center;flex:1;padding:10px}
.bigstim svg{width:min(58vh,420px);height:min(58vh,420px)}
.ack{
  text-align:center;font-family:Georgia,serif;font-size:1.2rem;color:var(--moss);
  min-height:34px;margin-top:10px;opacity:0;transition:opacity .2s
}
.ack.show{opacity:1}
.script{
  border:2px dashed var(--sand-d);background:#FDF6E7;border-radius:16px;padding:14px 16px;
  margin:12px 0 0;font-size:.92rem;color:var(--ink-soft)
}
.script b{color:var(--ink)}
.rubric{background:var(--paper);border:2px solid var(--forest);border-radius:20px;padding:16px 18px;margin-top:14px}
.rubric .lv{
  display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;
  border:2px solid var(--sand-d);border-radius:16px;background:var(--paper);margin-bottom:10px;min-height:72px
}
.rubric .lv.on{border-color:var(--forest);background:#F2F6EE}
.rubric .lv .n{
  width:40px;height:40px;flex:0 0 auto;border-radius:12px;background:var(--sand);
  display:flex;align-items:center;justify-content:center;font-weight:700
}
.rubric .lv.on .n{background:var(--forest);color:#fff}

/* ---------- bands ---------- */
.band{display:inline-flex;align-items:center;gap:7px;padding:5px 13px;border-radius:999px;font-size:.8rem;font-weight:600;border:1.5px solid}
.band.secure{background:#EAF2E6;border-color:var(--moss);color:#3B5B2C}
.band.developing{background:#FBF1DE;border-color:var(--gold);color:#7A5A1D}
.band.emerging{background:#F4EDE6;border-color:var(--clay);color:#7E462A}
.band.unassessed{background:#F2F1EE;border-color:var(--sand-d);color:var(--ink-soft)}
.mstone{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.mstone:last-child{border-bottom:none}
.mstone .txt{flex:1}
.tag{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:8px}
.headline{font-family:Georgia,"Songti SC",serif;font-size:1.28rem;line-height:1.5}
.bignum{font-family:Georgia,serif;font-size:3.2rem;line-height:1;color:var(--forest)}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.obsitem{padding:18px 0;border-bottom:1px solid var(--line)}
.obsbands{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:12px}
.obsbands button{
  text-align:left;border:2px solid var(--sand-d);border-radius:16px;padding:12px 14px;background:var(--paper);
  min-height:96px;font-size:.9rem
}
.obsbands button.on{border-color:var(--forest);background:#F2F6EE}
.obsbands button .lbl{display:block;font-weight:700;margin-bottom:4px}
.hold{position:relative;overflow:hidden}
.hold .fill{position:absolute;left:0;bottom:0;height:3px;background:var(--forest);width:0}
.center{text-align:center}
.closewrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
@keyframes petal{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(120px) rotate(220deg);opacity:0}}
.petal{position:absolute;width:16px;height:16px;border-radius:60% 0 60% 0;background:var(--gold);animation:petal 4.2s linear infinite}
.sky{position:relative;width:100%;max-width:520px;height:130px;overflow:hidden}
.foot{font-size:.76rem;color:var(--ink-soft);line-height:1.5;border-top:1px solid var(--line);padding-top:14px;margin-top:20px}
.pill{display:inline-block;background:var(--sand);border-radius:999px;padding:3px 12px;font-size:.76rem;margin:0 6px 6px 0}
.warnbar{background:#FBF1DE;border:1px solid var(--gold);border-radius:14px;padding:10px 14px;font-size:.85rem;margin-bottom:16px}
.hidden{display:none!important}
@media print{
  body{background:#fff;font-size:9.5pt}
  .mstone.un{display:none}          /* the printed sheet lists what was looked at */
  .guide,.sky{display:none}
  .grid2{grid-template-columns:repeat(3,1fr)}
  .bignum{font-size:2rem}
  h1{font-size:1.3rem} h2{font-size:1.05rem;margin-top:6px} h3{font-size:.95rem}
  .foot{font-size:7.5pt}
  .card{padding:6px 9px;margin-bottom:7px}
  .mstone{padding:4px 0}
  .card.quiet:empty,.warnbar,.script,.rubric{display:none}
  .obsitem{display:none}
  .tbar,.actions,.noprint,.btn{display:none!important}
  .card{border:1px solid #999;box-shadow:none;break-inside:avoid;padding:10px 12px;margin-bottom:10px}
  .wrap{max-width:100%;padding:0}
  @page{size:A4 portrait;margin:14mm}
}
</style>
</head>

/* ===================================================================
   Montree Milestones — standalone tablet build (D2)
   One file. No build step. No network. Works offline.
   Session state is IN MEMORY ONLY — nothing is written to this device.
   =================================================================== */

var BANK = JSON.parse(document.getElementById('item-bank').textContent);

var IDX = {
  item:{}, stim:{}, ms:{}, strand:{}, domain:{}, module:{}, obsItem:{}, checklist:{}
};
BANK.items.forEach(function(i){ IDX.item[i.id]=i; });
BANK.stimuli.forEach(function(s){ IDX.stim[s.id]=s; });
BANK.milestones.forEach(function(m){ IDX.ms[m.id]=m; });
BANK.strands.forEach(function(s){ IDX.strand[s.id]=s; });
BANK.domains.forEach(function(d){ IDX.domain[d.id]=d; });
BANK.modules.forEach(function(m){ IDX.module[m.id]=m; });
// Observation records live inside items[] in the canonical bank (type observation_checklist).
BANK.observationItems = BANK.items.filter(function(i){ return i.type==='observation_checklist'; });
BANK.observationItems.forEach(function(o){ IDX.obsItem[o.id]=o; });
BANK.observationChecklists.forEach(function(c){ IDX.checklist[c.id]=c; });

/* --------------------------- persistence -------------------------
   Autosave to localStorage after every response, under mm.session.<uuid>, per
   ARCHITECTURE §6 D2. Feature-detected in a try/catch: private mode, a locked-down
   kiosk profile or a file:// policy that throws just means the check-in stays in
   memory and the teacher is told so. Demo mode never writes. */
var STORE = (function(){
  var ls = null, ok = false;
  try {
    ls = window.localStorage;
    var probe = 'mm.probe.' + Math.random();
    ls.setItem(probe, '1'); ls.removeItem(probe); ok = true;
  } catch(e){ ls = null; ok = false; }
  return {
    available: ok,
    list: function(){
      if (!ok) return [];
      var out = [];
      try {
        for (var i=0;i<ls.length;i++){
          var k = ls.key(i);
          if (k && k.indexOf('mm.session.')===0){
            var v = null;
            try { v = JSON.parse(ls.getItem(k)); } catch(e){ v = null; }
            if (v && v.run) out.push({key:k, snap:v});
          }
        }
      } catch(e){ return []; }
      out.sort(function(a,b){ return (b.snap.savedAt||'').localeCompare(a.snap.savedAt||''); });
      return out;
    },
    set: function(k,v){ if(!ok) return false; try { ls.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } },
    del: function(k){ if(!ok) return; try { ls.removeItem(k); } catch(e){} }
  };
})();
function uuid(){
  try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch(e){}
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
    var r = Math.random()*16|0; return (c==='x'? r : (r&0x3|0x8)).toString(16);
  });
}
function saveRun(){
  var r = S.run;
  if (!r || r.demo || !STORE.available) return;      // demo mode never writes
  var snap = { v:1, savedAt:new Date().toISOString(), bankVersion:BANK.bankVersion,
    cfg: S.cfg,
    run: {
      id:r.id, childRef:r.childRef, ageBand:r.ageBand, ageMonths:r.ageMonths,
      windowCode:r.windowCode, form:r.form, schoolYear:r.schoolYear, demo:r.demo,
      modules:r.modules, directModules:r.directModules,
      startedAt:r.startedAt, completedAt:r.completedAt, durationSeconds:r.durationSeconds||null,
      responses:r.responses, observations:r.observations, overrides:r.overrides,
      mi:r.mi, si:r.si, strandStreak:r.strandStreak, moduleStreak:r.moduleStreak,
      extensionUsed:r.extensionUsed
    },
    screen: (S.screen==='item'||S.screen==='practice') ? S.screen : S.screen,
    steps: r.steps.map(function(x){
      return { t:x.t, itemId:x.item.id, moduleId:x.moduleId,
               skipped:!!x.skipped, extension:!!x.extension };
    })

}
function restoreRun(entry){
  var snap = entry.snap, r = snap.run;
  r.startedMs = nowMs() - 1000;
  r.steps = snap.steps.map(function(x){
    var it = IDX.item[x.itemId];
    if (!it) return null;
    if (x.extension){ var c = Object.create(it); c.__extension = true; it = c; }
    return { t:x.t, item:it, moduleId:x.moduleId, skipped:!!x.skipped, extension:!!x.extension };
  }).filter(Boolean);
  r.extensionEvidence = null;
  S.cfg = snap.cfg || S.cfg;
  S.run = r;
  if (r.completedAt){ S.lastResults = scoreRun(r); go('results'); return; }
  // a step already answered (or skipped by a stop rule) is never shown to the child again
  while (r.steps[r.si] && (r.steps[r.si].skipped ||
        (r.steps[r.si].t==='item' && r.responses[r.steps[r.si].item.id]))) r.si++;
  var st = curStep();
  if (!st){
    if (r.modules.indexOf('M-OBS')>=0) go('observation'); else finishRun();
    return;
  }
  S.screen = st.t==='practice' ? 'practice' : 'item';
  beginItem(); render();
}

function pickVoice(){
  if (!S.speechAvailable) return null;
  var vs = window.speechSynthesis.getVoices() || [];
  if (!vs.length) return null;
  var pref = ['en-GB','en_GB','en-US','en_US','en'];
  for (var p=0;p<pref.length;p++){
    for (var i=0;i<vs.length;i++){
      if ((vs[i].lang||'').indexOf(pref[p])===0) return vs[i];
    }
  }
  return vs[0];
}
if (S.speechAvailable){
  try {
    window.speechSynthesis.onvoiceschanged = function(){ if(!S.voice) S.voice = pickVoice(); };
    S.voice = pickVoice();
  } catch(e){ S.speechAvailable = false; }
}
function speak(text){
  if (!text) return false;
  if (!S.speechAvailable || !S.soundEnabled) return false;
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    // Child-facing audio is English in this standalone build (EFL prompts are English by construct).
    u.lang = 'en-GB';
    if (!S.voice) S.voice = pickVoice();
    if (S.voice) u.voice = S.voice;
    u.rate = 0.85; u.pitch = 1.0; u.volume = 1;
    window.speechSynthesis.speak(u);
    return true;
  } catch(e){ return false; }
}

/* Press-and-hold control: child-safe access to teacher surfaces. */
function attachHold(node, ms, fn){
  if (!node) return;
  var timer=null, fill=node.querySelector('.fill'), startX=0, startY=0;
  function begin(ev){
    var pt = ev.touches ? ev.touches[0] : ev;
    startX = pt.clientX||0; startY = pt.clientY||0;
    if (fill){ fill.style.transition='none'; fill.style.width='0%';
      setTimeout(function(){ if(fill){ fill.style.transition='width '+ms+'ms linear'; fill.style.width='100%'; } },10); }
    timer = setTimeout(function(){ cancel(); fn(); }, ms);
  }
  function cancel(){
    if (timer){ clearTimeout(timer); timer=null; }
    if (fill){ fill.style.transition='width .18s'; fill.style.width='0%'; }
  }
  node.addEventListener('pointerdown', begin);
  node.addEventListener('pointerup', cancel);
  node.addEventListener('pointerleave', cancel);
  node.addEventListener('pointercancel', cancel);
  // Mouse/touch fallback for engines that do not emit pointer events.
  node.addEventListener('mousedown', function(e){ if (!window.PointerEvent) begin(e); });
  node.addEventListener('mouseup', function(){ if (!window.PointerEvent) cancel(); });
  node.addEventListener('touchstart', function(e){ if (!window.PointerEvent) begin(e); }, {passive:true});
  node.addEventListener('touchend', function(){ if (!window.PointerEvent) cancel(); });
}

/* Single-tap response binding: pointerup, 12px movement tolerance, debounced.
   400 ms between responses that advance the screen (no accidental double-advance);
   250 ms between the individual touches of a "touch this, then that" sequence,
   because those are all part of one answer and a child may make them quickly. */
var lastResponseAt = 0;
var tapGuardMs = 400;
function bindTap(node, fn){
  var sx=0, sy=0, armed=false;
  function down(ev){ var p = ev.touches?ev.touches[0]:ev; sx=p.clientX||0; sy=p.clientY||0; armed=true; }
  function up(ev){
    if (!armed) return; armed=false;
    var p = (ev.changedTouches?ev.changedTouches[0]:ev);
    var dx = Math.abs((p.clientX||0)-sx), dy = Math.abs((p.clientY||0)-sy);
    if (dx>12 || dy>12) return;                    // a drag is not a tap
    // The guard only ever suppresses a tap that follows another REGISTERED tap.
    // A freshly rendered item starts with lastResponseAt = 0, so the child's first
    // touch always lands — there is no dead window and no dwell-time floor.
    if (lastResponseAt && nowMs()-lastResponseAt < tapGuardMs) return;
    lastResponseAt = nowMs();
    fn(ev);
  }
  node.addEventListener('pointerdown', down);
  node.addEventListener('pointerup', up);
  if (!window.PointerEvent){
    node.addEventListener('mousedown', down); node.addEventListener('mouseup', up);
    node.addEventListener('touchstart', down, {passive:true}); node.addEventListener('touchend', up);
  }
}

var BANDS_UP = { A3:'A4', A4:'A5', A5:null };

function itemsFor(moduleId, band, form){
  var mod = IDX.module[moduleId];
  var order = {}; (mod.strandIds||[]).forEach(function(s,i){ order[s]=i; });
  return BANK.items.filter(function(i){
    return i.moduleId===moduleId && i.ageBand===band && i.form===form
        && i.type!=='observation_checklist';
  }).sort(function(a,b){
    var oa=order[a.strandId]==null?99:order[a.strandId], ob=order[b.strandId]==null?99:order[b.strandId];
    return oa-ob || a.sequence-b.sequence;
  });
}
function practiceFor(moduleId, band){
  var mod = IDX.module[moduleId];
  var ids = (mod.practiceItemIds && mod.practiceItemIds[band]) || [];
  return ids.map(function(id){ return IDX.item[id]; }).filter(Boolean);
}

function startRun(){
  var c = S.cfg;

  S.run = {
    id: uuid(),

    ageBand: c.ageBand, ageMonths: c.ageMonths, windowCode: c.windowCode,
    form: c.form, schoolYear: c.schoolYear, demo: c.demo,
    modules: c.modules.slice(),
    directModules: mods,
    startedAt: new Date().toISOString(), startedMs: nowMs(),
    responses: {},        // itemId -> record
    observations: {},     // milestoneId -> {band, note}
    overrides: {},        // milestoneId -> {band, reason}
    mi: 0, steps: [], si: 0,

function openModule(idx){
  var r = S.run; r.mi = idx; r.si = 0; r.moduleStreak = 0; r.strandStreak = {};
  var mid = r.directModules[idx];
  var steps = [];
  practiceFor(mid, r.ageBand).forEach(function(it){ steps.push({t:'practice', item:it, moduleId:mid}); });
  itemsFor(mid, r.ageBand, r.form).forEach(function(it){ steps.push({t:'item', item:it, moduleId:mid}); });

}
function curStep(){ var r=S.run; return r.steps[r.si] || null; }
function curModuleId(){ var r=S.run; return r.directModules[r.mi]; }

/* record one response and apply stop / extension rules */
function recordResponse(item, payload, isPractice){
  var r = S.run;
  if (isPractice) return;                 // practice is never part of the record
  var max = item.scoring.maxPoints || 1;
  var pts = payload.pointsAwarded;
  r.responses[item.id] = {
    itemId:item.id, strandId:item.strandId, moduleId:item.moduleId, ageBand:item.ageBand,
    form:item.form, itemType:item.type,
    response: payload.response, pointsAwarded: pts, pointsPossible: max,
    isCorrect: pts >= max, latencyMs: payload.latencyMs||null,
    replayCount: payload.replayCount||0, administered:true,
    isExtension: !!item.__extension, answeredAt: new Date().toISOString()
  };
  var incorrect = (pts === 0);
  var st = IDX.strand[item.strandId] || {};
  var mod = IDX.module[item.moduleId] || {};
  var countsStrand = countsStrandStop(item);
  var countsModule = countsModuleStop(item);

  if (countsStrand){
    r.strandStreak[item.strandId] = incorrect ? (r.strandStreak[item.strandId]||0)+1 : 0;
  }
  if (countsModule){
    r.moduleStreak = incorrect ? r.moduleStreak+1 : 0;
  }
  // module stop rule — gently end the module
  if (mod.stopRule && mod.stopRule.type==='consecutive_incorrect' && r.moduleStreak >= mod.stopRule.n){
    skipRemaining(function(s){ return s.moduleId===item.moduleId; }, 'module_stop');
    saveRun();
    return;
  }
  // strand stop rule — move on to the next strand
  if (st.stopRule && st.stopRule.type==='consecutive_incorrect' && (r.strandStreak[item.strandId]||0) >= st.stopRule.n){
    skipRemaining(function(s){ return s.t==='item' && s.item.strandId===item.strandId; }, 'strand_stop');
  }
  saveRun();                                   // autosave after every response
}

function skipRemaining(pred, reason){
  var r = S.run;
  for (var i=r.si+1; i<r.steps.length; i++){
    var s = r.steps[i];
    if (s.t!=='item' || s.skipped) continue;
    if (!pred(s)) continue;
    s.skipped = true;
    r.responses[s.item.id] = {
      itemId:s.item.id, strandId:s.item.strandId, moduleId:s.item.moduleId,
      ageBand:s.item.ageBand, form:s.item.form, itemType:s.item.type,
      response:{}, pointsAwarded:0, pointsPossible:s.item.scoring.maxPoints||1,
      isCorrect:null, administered:false, skippedReason:reason, answeredAt:new Date().toISOString()
    };
  }
}

/* extension rule: a strand answered fully correct earns items from the band above */
/* Item ids the bank actually treats as band-up evidence for THIS child's band:
   milestones at the child's band with expectation 'extension' whose evidence sits in a
   higher band. Outside that set, a bonus round buys nothing and costs sitting time. */
function extensionEvidenceIds(band, form){
  var out = {};
  BANK.milestones.forEach(function(m){
    if (m.ageBand !== band || m.expectation !== 'extension') return;
    var ev = m.evidence || {};
    if (!ev.evidenceBand || ev.evidenceBand === band) return;   // same-band harder item, not band-up
    var ids = (ev.byForm && ev.byForm[form]) || ev.itemIds || [];
    ids.forEach(function(id){ out[id] = m.id; });
  });
  return out;
}

function maybeExtend(finishedStrandId, moduleId){
  var r = S.run, mod = IDX.module[moduleId];
  if (!mod || !mod.extensionRule || !mod.extensionRule.administerBandUp) return;
  var up = BANDS_UP[r.ageBand]; if (!up) return;
  var key = moduleId+'|'+finishedStrandId;
  if (r.extensionUsed[key]) return;
  // The extension allowance is per module (§1.3): up to maxItems from the band above, in total.
  var cap = mod.extensionRule.maxItems || 4;
  var alreadyExtended = r.steps.filter(function(x){ return x.extension && x.moduleId===moduleId; }).length;
  var room = cap - alreadyExtended;
  if (room <= 0) return;
  var done = Object.keys(r.responses).map(function(k){ return r.responses[k]; })
    .filter(function(x){ return x.strandId===finishedStrandId && x.moduleId===moduleId && x.administered && !x.isExtension; });
  if (!done.length) return;
  var allCorrect = done.every(function(x){ return x.pointsAwarded >= x.pointsPossible; });
  if (!allCorrect) return;
  var allowed = r.extensionEvidence || (r.extensionEvidence = extensionEvidenceIds(r.ageBand, r.form));
  var pool = BANK.items.filter(function(i){
    return i.moduleId===moduleId && i.strandId===finishedStrandId && i.ageBand===up
        && i.form===r.form && i.scored!==false && allowed[i.id];
  }).sort(function(a,b){ return a.sequence-b.sequence; }).slice(0, room);
  if (!pool.length) return;   // nothing at the band above that this bank can evidence
  r.extensionUsed[key] = true;
  var ins = r.si+1;
  pool.forEach(function(it, k){
    var clone = Object.create(it); clone.__extension = true;
    r.steps.splice(ins+k, 0, {t:'item', item:clone, moduleId:moduleId, extension:true});
  });
}

/* advance the flow */
function advance(){
  var r = S.run, prev = r.steps[r.si];
  if (prev && prev.t==='item' && !prev.skipped && !prev.extension){
    var nxt = r.steps[r.si+1];
    var strandDone = !nxt || nxt.t!=='item' || nxt.item.strandId !== prev.item.strandId;
    if (strandDone) maybeExtend(prev.item.strandId, prev.moduleId);
  }
  r.si++;
  while (r.steps[r.si] && r.steps[r.si].skipped) r.si++;
  if (r.si >= r.steps.length){
    if (r.mi + 1 < r.directModules.length){ openModule(r.mi+1); go('rest'); }
    else if (r.modules.indexOf('M-OBS') >= 0){ go('observation'); }
    else { finishRun(); }
    return;
  }
  var st = r.steps[r.si];
  S.screen = (st.t==='practice') ? 'practice' : 'item';
  saveRun();                       // position, not just the answer
  beginItem();
  render();
}

function finishRun(){
  var r = S.run;
  if (!r.completedAt){
    r.completedAt = new Date().toISOString();
    r.durationSeconds = Math.round((nowMs()-r.startedMs)/1000);
  }
  S.lastResults = scoreRun(r);
  saveRun();
  go('close');
}

/* =================================================================
   SCORING — re-derived from the bank on every render
   ================================================================= */
function evidenceItemsFor(m, form){
  var ev = m.evidence || {};
  if (ev.byForm && ev.byForm[form] && ev.byForm[form].length) return ev.byForm[form];
  var ids = ev.itemIds || [];
  var sameForm = ids.filter(function(id){ return IDX.item[id] && IDX.item[id].form===form; });
  return sameForm.length ? sameForm : ids;
}

function scoreRun(r){
  var minCovDefault = BANK.scoring.minCoverage;
  var TH = BANK.scoring.milestoneThresholds;
  var results = [];

  BANK.milestones.forEach(function(m){
    var row = {
      milestoneId:m.id, strandId:m.strandId, domainId:m.domainId, ageBand:m.ageBand,
      expectation:m.expectation, statement:m.statement,
      track:(IDX.domain[m.domainId]||{}).track || 'core',
      bandComputed:'unassessed', bandSource:'direct', coverage:0,
      pointsEarned:null, pointsPossible:null, evidenceNote:null
    };
    if (m.evidence && m.evidence.observationItemId){
      row.bandSource = 'observation';
      var rating = r.observations[m.id];
      if (rating && rating.band){ row.bandComputed = rating.band; row.coverage = 1; row.evidenceNote = rating.note||null; }
      else { row.bandComputed = 'unassessed'; row.coverage = 0; }
    } else {
      var declared = evidenceItemsFor(m, r.form);
      var admin = declared.filter(function(id){
        var x = r.responses[id];
        // A stretch item from the band above is recorded, never used as milestone evidence —
        // it must not quietly complete a milestone belonging to a future check-in.
        return x && x.administered && !x.isExtension;
      });
      var cov = declared.length ? admin.length/declared.length : 0;
      var minCov = (m.evidence && m.evidence.minCoverage != null) ? m.evidence.minCoverage : minCovDefault;
      row.coverage = Math.round(cov*1000)/1000;
      if (cov < minCov || !admin.length){
        row.bandComputed = 'unassessed';
      } else {
        var earned=0, possible=0;
        admin.forEach(function(id){ var x=r.responses[id]; earned+=x.pointsAwarded; possible+=x.pointsPossible; });
        row.pointsEarned = earned; row.pointsPossible = possible;
        var ratio = possible ? earned/possible : 0;
        row.ratio = Math.round(ratio*1000)/1000;
        row.bandComputed = ratio >= TH.secure ? 'secure' : (ratio >= TH.developing ? 'developing' : 'emerging');
      }
    }
    var ov = r.overrides[m.id];
    if (ov && ov.band){
      row.bandFinal = ov.band; row.bandSource = 'teacher_override'; row.overrideReason = ov.reason||'';
    } else {
      row.bandFinal = row.bandComputed;
    }
    results.push(row);
  });

  var out = { results:results, ageBand:r.ageBand, childRef:r.childRef, windowCode:r.windowCode };
  out.core = computeMAP(results, r.ageBand, 'core');
  out.efl  = computeMAP(results, r.ageBand, 'efl');
  // Counts are scoped to the child's own age band — that is the set this check-in is about.
  var inBand = results.filter(function(x){ return x.ageBand===r.ageBand; });
  out.counts = {
    scope: r.ageBand, total: inBand.length,
    secure: inBand.filter(function(x){ return x.bandFinal==='secure'; }).length,
    developing: inBand.filter(function(x){ return x.bandFinal==='developing'; }).length,
    emerging: inBand.filter(function(x){ return x.bandFinal==='emerging'; }).length,
    unassessed: inBand.filter(function(x){ return x.bandFinal==='unassessed'; }).length,
    overrides: inBand.filter(function(x){ return x.bandSource==='teacher_override'; }).length
  };
  out.domains = BANK.domains.map(function(d){
    var rows = results.filter(function(x){ return x.domainId===d.id && x.ageBand===r.ageBand && x.bandFinal!=='unassessed'; });
    var all  = results.filter(function(x){ return x.domainId===d.id && x.ageBand===r.ageBand; });
    var mean = rows.length ? rows.reduce(function(a,x){ return a+bandIdx(x.bandFinal); },0)/rows.length : null;
    return {
      id:d.id, name:d.name, track:d.track, n:rows.length, total:all.length,
      band: mean==null ? 'unassessed' : bestFitBand(mean),
      securePct: rows.length >= BANK.scoring.domainBandMinN
        ? Math.round(rows.filter(function(x){return x.bandFinal==='secure';}).length/rows.length*100/5)*5 : null,
      minN: BANK.scoring.domainBandMinN
    };
  }).filter(function(d){ return d.total>0; });
  out.strands = BANK.strands.map(function(s){
    var rows = results.filter(function(x){ return x.strandId===s.id && x.ageBand===r.ageBand; });
    var seen = rows.filter(function(x){ return x.bandFinal!=='unassessed'; });
    var mean = seen.length ? seen.reduce(function(a,x){ return a+bandIdx(x.bandFinal); },0)/seen.length : null;
    return { id:s.id, name:s.name, domainId:s.domainId, method:s.method, n:seen.length, total:rows.length,
             band: mean==null?'unassessed':bestFitBand(mean) };
  }).filter(function(s){ return s.total>0; });
  return out;
}

function computeMAP(results, band, track){
  var rows = results.filter(function(x){
    return x.expectation==='expected' && x.ageBand===band && x.track===track && x.bandFinal!=='unassessed';
  });
  var pool = results.filter(function(x){
    return x.expectation==='expected' && x.ageBand===band && x.track===track;
  });
  var met = rows.filter(function(x){ return x.bandFinal==='secure'; }).length;
  var exceeded = results.filter(function(x){
    return x.expectation==='extension' && x.track===track && x.bandFinal==='secure';
  }).length;
  var n = rows.length;
  var minN = BANK.scoring.mapSuppressionMinN;
  // EFL MAP% is suppressed outright at A3 and A4 (too few expected English milestones exist there),
  // and is always reported on its own — never folded into the core figure.
  var eflBandSuppressed = (track==='efl' && (band==='A3' || band==='A4'));
  var suppressed = (n < minN) || eflBandSuppressed;
  return {
    track:track, n:n, poolTotal:pool.length, met:met, exceeded:exceeded,
    unassessed: pool.length - n,
    percent: (suppressed || !n) ? null : Math.round((met/n*100)/BANK.scoring.mapRounding)*BANK.scoring.mapRounding,
    suppressed: suppressed, minN: minN,
    suppressReason: eflBandSuppressed ? 'efl_band' : (n<minN ? 'small_n' : null)
  };
}

/* growth against an earlier check-in (imported file or an earlier run this page load) */
function computeGrowth(current){
  var prior = S.prior;
  if (!prior || !prior.milestoneBands) return null;
  var up=0, steady=0, watch=0, pairs=[];
  current.results.forEach(function(x){
    if (x.bandFinal==='unassessed') return;
    var pb = prior.milestoneBands[x.milestoneId];
    if (!pb || pb==='unassessed') return;
    var d = bandIdx(x.bandFinal) - bandIdx(pb);
    if (d>0) up++; else if (d===0) steady++; else watch++;
    pairs.push({id:x.milestoneId, from:pb, to:x.bandFinal});
  });
  if (!pairs.length) return null;
  return { up:up, steady:steady, watch:watch, pairs:pairs,
           windowCode: prior.windowCode||'', childRef: prior.childRef||'' };
}

function rubricPanel(item){

  if (!rub && item.scoring.rubricRef) rub = BANK.rubrics[item.scoring.rubricRef];
  if (!rub) return '';
  var IS = S.itemState;
  return '<div class="rubric"><div class="small muted" style="margin-bottom:8px">'+T('teacherOnly')+' · '
    + esc(L(item.prompt.teacherScript))+'</div>'

        return '<button class="lv'+(IS.rubric===lv.score?' on':'')+'" data-rub="'+lv.score+'">'

function beginItem(){
  S.itemState = { shownAt: nowMs(), replayCount:0, picked:[], ack:'', rubric:null, tries:0, hint:null, locked:false };
  var st = curStep(); if (!st) return;
  var need = needTaps(st.item);
  tapGuardMs = need > 1 ? 250 : 400;
  lastResponseAt = 0;                // no guard until this item has registered a tap
  setTimeout(function(){ speak(L(st.item.prompt.audio)); }, 260);
}

function neutralAck(item){
  var mod = IDX.module[item.moduleId];
  return (item.feedback && item.feedback.neutral && L(item.feedback.neutral))
      || (mod && mod.neutralFeedback && L(mod.neutralFeedback)) || T('yes');
}

function handleOption(optId){
  var st = curStep(); if (!st) return;
  var item = st.item, IS = S.itemState;
  if (IS.locked) return;
  var need = needTaps(item);
  if (IS.picked.indexOf(optId) >= 0) return;
  IS.picked.push(optId);
  if (IS.picked.length < need){ render(); return; }
  IS.locked = true;
  var ok;
  if (need > 1){
    var seq = correctSeq(item);
    ok = IS.picked.length===seq.length && IS.picked.every(function(x,i){ return x===seq[i]; });
  } else {
    ok = correctIds(item).indexOf(optId) >= 0;
  }
  finishItemResponse(item, st, ok, ok ? (item.scoring.maxPoints||1) : 0, {optionIds:IS.picked.slice()});
}

/* A child may touch fewer things than the instruction asked for. The teacher closes
   the answer with what was touched — the check-in never gets stuck on a screen. */
function finishSequence(){
  var st = curStep(); if (!st) return;
  var item = st.item, IS = S.itemState;
  if (IS.locked || !IS.picked.length) return;
  IS.locked = true;
  var seq = correctSeq(item);
  var ok = IS.picked.length===seq.length && IS.picked.every(function(x,i){ return x===seq[i]; });
  finishItemResponse(item, st, ok, ok ? (item.scoring.maxPoints||1) : 0, {optionIds:IS.picked.slice(), partial:true});
}

function handleRubric(score){
  var st = curStep(); if (!st) return;
  var item = st.item, IS = S.itemState;
  if (IS.locked) return;
  IS.rubric = score; IS.locked = true;
  finishItemResponse(item, st, score>0, score, {rubricScore:score});
}

function finishItemResponse(item, step, ok, points, response){
  var IS = S.itemState;
  var practice = (step.t==='practice');
  if (practice){
    IS.tries++;
    if (ok){
      IS.ack = L(item.feedback && item.feedback.correct) || T('yes');
      render(); speak(IS.ack);
      setTimeout(function(){ advance(); }, 1400);
    } else if (IS.tries < 2){
      IS.ack = L(item.feedback && item.feedback.tryAgain) || '';
      render(); speak(IS.ack);
      setTimeout(function(){
        IS.picked = []; IS.locked = false; IS.ack=''; render();
        setTimeout(function(){ speak(L(item.prompt.audio)); }, 200);
      }, 1500);
    } else {
      IS.hint = (correctIds(item).length ? correctIds(item) : correctSeq(item)).slice();
      IS.ack = L(item.feedback && item.feedback.correct) || '';
      render(); speak(IS.ack);
      setTimeout(function(){ advance(); }, 1700);
    }
    return;
  }
  recordResponse(item, {
    pointsAwarded: points, response: response,
    latencyMs: nowMs()-IS.shownAt, replayCount: IS.replayCount
  }, false);
  IS.ack = neutralAck(item);                 // neutral acknowledgement only — never right/wrong
  render(); speak(IS.ack);
  setTimeout(function(){ advance(); }, 900);
}

/* ------------------------------ export --------------------------- */
function buildPayload(){
  var r = S.run, R = scoreRun(r);
  var bands = {}; R.results.forEach(function(x){ bands[x.milestoneId] = x.bandFinal; });
  return {
    app: 'montree-milestones-standalone',
    exportedAt: new Date().toISOString(),
    bankVersion: BANK.bankVersion,
    bankChecksum: BANK.bankChecksum,
    note: 'Client-computed bands are for the teacher on this device. The server re-scores from the bank; it never trusts these numbers.',
    session: {
      childRef: r.childRef, schoolYear: r.schoolYear, windowCode: r.windowCode,
      ageMonths: r.ageMonths, ageBand: r.ageBand, formCode: r.form,
      modules: r.modules, deliveryMode: 'tablet', assessmentLocale: 'en',
      startedAt: r.startedAt, completedAt: r.completedAt, durationSeconds: r.durationSeconds || null,
      demo: !!r.demo
    },
    responses: Object.keys(r.responses).map(function(k){
      var x = r.responses[k];
      return {
        itemId:x.itemId, strandId:x.strandId, moduleId:x.moduleId, itemType:x.itemType,
        response:x.response, pointsAwarded:x.pointsAwarded, pointsPossible:x.pointsPossible,
        latencyMs:x.latencyMs||null, replayCount:x.replayCount||0, attempts:1,
        answeredAt:x.answeredAt,
        // Stretch items travel as evidence-excluded: the server re-scores from responses and
        // has no per-response scope, so administered:false is how we stop a band-up item
        // from marking a future age band's milestone secure.
        administered: x.isExtension ? false : x.administered,
        skippedReason: x.isExtension ? 'extension_band_up' : (x.skippedReason||null),
        isExtension: !!x.isExtension
      };
    }),
    observations: Object.keys(r.observations).filter(function(k){ return r.observations[k].band; })
      .map(function(k){ return { milestoneId:k, band:r.observations[k].band, note:r.observations[k].note||null }; }),
    overrides: Object.keys(r.overrides).map(function(k){
      return { milestoneId:k, band:r.overrides[k].band, reason:r.overrides[k].reason||'' }; }),
    clientSummary: {
      core: R.core, efl: R.efl, counts: R.counts,
      domains: R.domains.map(function(d){ return {id:d.id, band:d.band, n:d.n, securePct:d.securePct}; }),
      milestoneBands: bands
    },
    childRef: r.childRef, windowCode: r.windowCode, milestoneBands: bands
  };
}
function downloadSession(){
  var r = S.run;
  if (r.demo){ alert(T('exportBlocked')); return; }
  var payload = buildPayload();
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var safe = (r.childRef||'child').replace(/[^A-Za-z0-9._-]+/g,'-').slice(0,40);
  a.href = url; a.download = 'montree-milestones-'+safe+'-'+r.windowCode+'-'+r.ageBand+'.json';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 800);
  S.exported = true;
  if (r.id) STORE.del('mm.session.'+r.id);   // the file exists now; nothing left to recover
}

   RENDER + EVENTS

function render(){
  var app = document.getElementById('app');
  var html = '';
  switch (S.screen){
    case 'setup':       html = screenSetup(); break;
    case 'briefing':    html = screenBriefing(); break;
    case 'intro':       html = screenIntro(); break;
    case 'practice':
    case 'item':        html = screenItem(); break;
    case 'rest':        html = screenRest(); break;
    case 'paused':      html = screenPaused(); break;
    case 'close':       html = screenClose(); break;
    case 'observation': html = screenObservation(); break;
    case 'results':     html = screenResults(); break;
    default:            html = screenSetup();
  }
  app.innerHTML = html;
  wire();
}
function wire(){
  $$('.optcard').forEach(function(n){
    bindTap(n, function(){ handleOption(n.getAttribute('data-opt')); });
  });
  $$('[data-hold]').forEach(function(n){
    var what = n.getAttribute('data-hold');
    attachHold(n, what==='results' ? 1200 : 1500, function(){
      if (what==='results'){ go('results'); }
      if (what==='end'){ if (confirm(T('confirmEnd'))) finishRun(); }
    });
  });
  var f = document.getElementById('priorFile');
  if (f) f.addEventListener('change', function(ev){
    var file = ev.target.files && ev.target.files[0]; if (!file) return;
    var rd = new FileReader();
    rd.onload = function(){
      try {
        var j = JSON.parse(rd.result);
        S.prior = { childRef: (j.session&&j.session.childRef)||j.childRef||'',
                    windowCode: (j.session&&j.session.windowCode)||j.windowCode||'',
                    milestoneBands: j.milestoneBands || (j.clientSummary&&j.clientSummary.milestoneBands) || null };
        if (!S.prior.milestoneBands) S.prior = null;
      } catch(e){ S.prior = null; }
      render();
    };
    rd.readAsText(file);
  });
}

document.getElementById('app').addEventListener('click', function(ev){
  var t = ev.target.closest ? ev.target.closest('[data-act],[data-rub],[data-obs],[data-ov],[data-ovband],[data-ovsave]') : null;
  if (!t) return;

  if (t.hasAttribute('data-rub')){ handleRubric(parseInt(t.getAttribute('data-rub'),10)); return; }

  if (t.hasAttribute('data-obs')){
    var mid = t.getAttribute('data-obs'), b = t.getAttribute('data-band');
    var cur = S.run.observations[mid] || {};
    if (!b){ delete cur.band; } else { cur.band = b; }
    S.run.observations[mid] = cur; saveRun(); render(); return;
  }
  if (t.hasAttribute('data-ov')){
    var id = t.getAttribute('data-ov');
    S.overrideOpen = (S.overrideOpen===id) ? null : id;
    var ex = S.run.overrides[id];
    S.ovDraft = ex ? {band:ex.band, reason:ex.reason} : {band:null, reason:''};
    render(); return;
  }
  if (t.hasAttribute('data-ovband')){
    S.ovDraft = S.ovDraft || {}; S.ovDraft.band = t.getAttribute('data-v');
    var rin = document.getElementById('ovReason'); if (rin) S.ovDraft.reason = rin.value;
    render(); return;
  }
  if (t.hasAttribute('data-ovsave')){
    var mid2 = t.getAttribute('data-ovsave');
    var reason = (document.getElementById('ovReason')||{}).value || '';
    if (!S.ovDraft || !S.ovDraft.band){ return; }
    if (!reason.trim()){ alert(T('overrideNeed')); return; }
    S.run.overrides[mid2] = { band:S.ovDraft.band, reason:reason.trim() };
    S.overrideOpen = null; S.ovDraft = null; saveRun(); render(); return;
  }

  var act = t.getAttribute('data-act'), v = t.getAttribute('data-v');
  switch (act){
    case 'loc': S.locale = v; render(); break;
    case 'sound':
      if (!S.speechAvailable) return;
      S.soundEnabled = !S.soundEnabled;
      if (S.soundEnabled){ if(!S.voice) S.voice = pickVoice(); speak('Hello. I am ready to play.'); }
      else if (window.speechSynthesis) window.speechSynthesis.cancel();
      render(); break;
    case 'soundtest':
      S.soundEnabled = true; if(!S.voice) S.voice = pickVoice();
      if (!speak('Hello! Can you hear me? Let us play together.')) alert(T('soundNone'));
      render(); break;
    case 'band': S.cfg.ageBand = v; S.cfg.ageMonths = ({A3:42,A4:54,A5:66})[v]; render(); break;
    case 'win':
      S.cfg.windowCode = v; S.cfg.form = (v==='winter') ? 'B' : 'A'; render(); break;
    case 'form': S.cfg.form = v; render(); break;
    case 'mod':
      var i = S.cfg.modules.indexOf(v);
      if (i>=0) S.cfg.modules.splice(i,1); else S.cfg.modules.push(v);
      render(); break;
    case 'demo': S.cfg.demo = !S.cfg.demo; render(); break;
    case 'script': S.scriptOpen = !S.scriptOpen; render(); break;
    case 'seqDone': finishSequence(); break;
    case 'replay':
      if (S.itemState){ S.itemState.replayCount++; }
      var stp = curStep(); if (stp) speak(L(stp.item.prompt.audio));
      break;
    case 'briefing': readSetupInputs(); go('briefing'); break;
    case 'home':
      // A new sitting starts blank — no previous child's name, band or module set.
      S.run = null; S.overrideOpen = null; S.ovDraft = null; S.lastResults = null;
      S.obsBand = null; S.exported = false; S.scriptOpen = false;
      S.cfg = { childRef:'', ageBand:'A4', ageMonths:54, windowCode:'autumn', form:'A',
                modules:['M-LIT'], demo:false, schoolYear:S.cfg.schoolYear };
      S.screen='setup'; render(); break;
    case 'resume': {
      var entry = STORE.list().filter(function(x){ return x.key===v; })[0];
      if (entry) restoreRun(entry); else render();
      break;
    }
    case 'discard': {
      var ent = STORE.list().filter(function(x){ return x.key===v; })[0];
      var nm = ent ? (ent.snap.run.childRef||'—') : '—';
      if (confirm(T('discardConfirm',{name:nm}))) { STORE.del(v); render(); }
      break;
    }
    case 'begin':
      readSetupInputs();
      if (!S.cfg.modules.length){ alert(T('noModules')); return; }
      startRun();
      break;
    case 'introGo':
      S.screen = (curStep() && curStep().t==='practice') ? 'practice' : 'item';
      beginItem(); render(); break;
    case 'restGo': go('intro'); break;
    case 'pause': go('paused'); break;
    case 'finish': finishRun(); break;
    case 'obsDone': finishRun(); break;
    case 'obsOpen': go('observation'); break;
    case 'obsBand': S.obsBand = v; render(); break;
    case 'download': downloadSession(); break;
    case 'print': window.print(); break;
    case 'ovCancel': S.overrideOpen=null; S.ovDraft=null; render(); break;
  }
});

document.getElementById('app').addEventListener('input', function(ev){
  var n = ev.target;
  if (n.id === 'childRef'){ S.cfg.childRef = n.value; return; }
  if (n.id === 'ageMonths'){ var v=parseInt(n.value,10); if(!isNaN(v)) S.cfg.ageMonths=v; return; }
  if (n.hasAttribute && n.hasAttribute('data-obsnote')){
    var mid = n.getAttribute('data-obsnote');
    var cur = S.run.observations[mid] || {};
    cur.note = n.value.slice(0,300);
    S.run.observations[mid] = cur;
    saveRun();
  }
});

function readSetupInputs(){
  var n = document.getElementById('childRef'); if (n) S.cfg.childRef = n.value.trim();
  var a = document.getElementById('ageMonths');
  if (a && a.value) S.cfg.ageMonths = Math.max(24, Math.min(84, parseInt(a.value,10)||54));
}

/* keep the child from leaving mid-item by accident, and remind about export */
window.addEventListener('beforeunload', function(e){
  if (S.run && !S.exported && Object.keys(S.run.responses||{}).length){
    e.preventDefault(); e.returnValue = ''; return '';
  }
});

render();
</script>
</body>
</html>
