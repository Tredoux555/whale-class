<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Potato Snaps — Design Spec v1.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   POTATO SNAPS — TOKENS
   Philosophy: "Lunchbox Modern"
   ============================================================ */
:root{
  /* ---- core palette ---- */
  --honey:#E8A317;        /* primary action */
  --honey-deep:#C9860B;   /* honey text on cream, icon strokes */
  --butter:#FFD466;       /* rings, halos, celebration */
  --butter-soft:#FFF0C9;  /* tinted surfaces */
  --blue:#9ED2F0;         /* progress, parent-side action */
  --blue-deep:#3E93C4;    /* blue text on cream */
  --sky:#EAF6FD;          /* wash surface */
  --cream:#FFFDF6;        /* page */
  --paper:#FFFFFF;        /* card */
  --sand:#F1E7D6;         /* bar track, hairlines */
  --sand-line:#EBDFC9;    /* card hairline */
  --ink:#23395B;          /* all text */
  --ink-70:rgba(35,57,91,.70);
  --ink-50:rgba(35,57,91,.50);
  --ink-35:rgba(35,57,91,.35);
  --coral:#FF7B6B;        /* destructive only */
  --coral-deep:#D6503F;   /* destructive text/border */

  /* ---- radii ---- */
  --r-card:24px;
  --r-btn:18px;
  --r-chip:999px;
  --r-tile:16px;

  /* ---- shadows (friendly only) ---- */
  --sh-card:0 1px 0 rgba(35,57,91,.04), 0 10px 22px -16px rgba(35,57,91,.30);
  --sh-lift:0 2px 0 rgba(35,57,91,.06), 0 14px 26px -16px rgba(35,57,91,.36);
  --sh-gold:0 2px 0 rgba(150,96,4,.18), 0 14px 26px -14px rgba(232,163,23,.55);

  --disp:'Baloo 2', ui-rounded, system-ui, sans-serif;
  --body:'Nunito', system-ui, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
}

/* ============================================================
   SPEC CANVAS CHROME
   ============================================================ */
.canvas{
  min-height:100vh;
  background:
    radial-gradient(1100px 620px at 12% -8%, #FFF3D6 0%, rgba(255,243,214,0) 62%),
    radial-gradient(900px 560px at 96% 4%, #E7F4FD 0%, rgba(231,244,253,0) 60%),
    var(--cream);
}
.canvas::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(35,57,91,.055) 1px, transparent 1px);
  background-size:26px 26px;
  mask-image:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.12));
  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.12));
}
.specbar{
  position:sticky;top:0;z-index:40;
  background:rgba(255,253,246,.86);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--sand-line);
}
.specbar__in{
  max-width:1240px;margin:0 auto;padding:16px 28px 14px;
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
}
.brandlock{display:flex;align-items:center;gap:12px;min-width:0}
.brandlock h1{
  font-family:var(--disp);font-weight:800;font-size:20px;margin:0;letter-spacing:-.01em;line-height:1;
}
.brandlock p{
  margin:3px 0 0;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-35);
}
.tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tab{
  font-family:var(--body);font-weight:800;font-size:13px;color:var(--ink-70);
  background:transparent;border:1.5px solid transparent;border-radius:999px;
  padding:9px 16px;cursor:pointer;transition:.16s;white-space:nowrap;
}
.tab:hover{background:rgba(35,57,91,.05);color:var(--ink)}
.tab.on{background:var(--ink);color:#FFFDF6;border-color:var(--ink)}
.tab .n{opacity:.45;margin-right:7px;font-family:var(--mono);font-size:11px}
.tab.on .n{opacity:.6}

.stage{max-width:1240px;margin:0 auto;padding:38px 28px 96px;position:relative;z-index:1}
.stage__head{margin:0 0 30px;max-width:620px}
.stage__eyebrow{
  font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  color:var(--honey-deep);margin:0 0 8px;display:flex;align-items:center;gap:10px;
}
.stage__eyebrow::after{content:"";height:1.5px;flex:1;background:linear-gradient(90deg,var(--butter),rgba(255,212,102,0))}
.stage__title{font-family:var(--disp);font-weight:800;font-size:34px;line-height:1.06;margin:0 0 10px;letter-spacing:-.02em}
.stage__sub{margin:0;font-size:15px;line-height:1.6;color:var(--ink-70);font-weight:600}

.split{display:grid;grid-template-columns:auto 1fr;gap:52px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:1fr;gap:34px}}

/* device frame */
.device{
  width:414px;padding:12px;border-radius:52px;background:var(--paper);
  border:1px solid var(--sand-line);
  box-shadow:0 3px 0 rgba(35,57,91,.05), 0 40px 70px -46px rgba(35,57,91,.55);
  position:relative;
}
.device__screen{
  width:390px;min-height:844px;border-radius:40px;overflow:hidden;background:var(--cream);
  position:relative;
}
.device__cap{
  position:absolute;left:0;right:0;bottom:-34px;text-align:center;
  font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-35);
}
.devicewrap{padding-bottom:44px}

/* annotation column */
.notes{padding-top:6px;max-width:460px}
.note{margin:0 0 26px}
.note h3{
  font-family:var(--disp);font-weight:800;font-size:17px;margin:0 0 10px;
  display:flex;align-items:center;gap:9px;
}
.note h3 .dot{width:9px;height:9px;border-radius:999px;background:var(--honey);flex:none}
.note ul{margin:0;padding:0;list-style:none}
.note li{
  font-size:13.5px;line-height:1.62;color:var(--ink-70);font-weight:600;
  padding:0 0 0 20px;margin:0 0 7px;position:relative;
}
.note li::before{
  content:"";position:absolute;left:4px;top:9px;width:6px;height:6px;border-radius:2px;
  background:var(--blue);
}
.note li b{color:var(--ink);font-weight:800}
.note code{
  font-family:var(--mono);font-size:11.5px;background:var(--sky);color:var(--blue-deep);
  padding:2px 6px;border-radius:6px;
}

/* ============================================================
   PHONE UI PRIMITIVES
   ============================================================ */
.app{width:100%;min-height:844px;background:var(--cream);position:relative;display:flex;flex-direction:column}
.bare .app{min-height:100vh}

.topbar{
  position:sticky;top:0;z-index:20;background:rgba(255,253,246,.94);
  backdrop-filter:blur(12px);
  padding:calc(14px + env(safe-area-inset-top)) 18px 13px;
  border-bottom:1px solid var(--sand-line);
  display:flex;align-items:center;gap:12px;
}
.topbar__txt{min-width:0;flex:1}
.topbar__title{font-family:var(--disp);font-weight:800;font-size:19px;line-height:1.12;margin:0;letter-spacing:-.01em}
.weekpill{
  display:inline-flex;align-items:center;gap:6px;margin-top:4px;
  background:var(--sky);color:var(--blue-deep);
  font-size:11.5px;font-weight:800;letter-spacing:.01em;
  padding:3px 10px;border-radius:999px;
}
.iconbtn{
  width:40px;height:40px;flex:none;border-radius:14px;border:1.5px solid var(--sand-line);
  background:var(--paper);display:grid;place-items:center;cursor:pointer;
}
.scroll{flex:1;padding:16px 16px 30px}

/* buttons */
.btn{
  font-family:var(--disp);font-weight:800;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:9px;
  border-radius:var(--r-btn);letter-spacing:-.005em;transition:.15s;
}
.btn--primary{background:var(--honey);color:var(--ink);box-shadow:var(--sh-gold)}
.btn--blue{background:var(--blue);color:var(--ink);box-shadow:0 2px 0 rgba(35,57,91,.07), 0 14px 26px -16px rgba(62,147,196,.7)}
.btn--ghost{background:var(--paper);color:var(--ink);border:1.5px solid var(--sand-line);box-shadow:var(--sh-card)}
.btn--danger{background:#FFF0ED;color:var(--coral-deep);border:1.5px solid rgba(214,80,63,.28)}
.btn--lg{height:56px;font-size:18px;padding:0 22px;width:100%}
.btn--md{height:46px;font-size:15.5px;padding:0 18px}
.btn--sm{height:36px;font-size:13.5px;padding:0 14px;border-radius:12px}
.btn[disabled]{background:var(--sand);color:var(--ink-35);box-shadow:none;cursor:default}

/* camera hero */
.camerabtn{
  width:100%;background:var(--honey);border:none;border-radius:var(--r-card);
  padding:15px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;
  box-shadow:var(--sh-gold);text-align:left;position:relative;overflow:hidden;
}
.camerabtn::after{
  content:"";position:absolute;right:-26px;top:-40px;width:120px;height:120px;border-radius:999px;
  background:rgba(255,255,255,.16);
}
.camerabtn__ic{
  width:52px;height:52px;flex:none;border-radius:18px;background:rgba(255,255,255,.9);
  display:grid;place-items:center;box-shadow:0 2px 0 rgba(150,96,4,.14);
}
.camerabtn__t{font-family:var(--disp);font-weight:800;font-size:19px;line-height:1.1;color:var(--ink)}
.camerabtn__s{font-family:var(--body);font-weight:700;font-size:12.5px;color:rgba(35,57,91,.68);margin-top:3px}

/* section label */
.seclabel{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  margin:22px 2px 11px;
}
.seclabel h2{font-family:var(--disp);font-weight:800;font-size:15px;margin:0;letter-spacing:.01em}
.seclabel span{font-size:11.5px;font-weight:800;color:var(--ink-35);letter-spacing:.02em}

/* ---- roster row ---- */
.row{
  background:var(--paper);border:1.5px solid var(--sand-line);border-radius:var(--r-card);
  padding:13px 15px;margin-bottom:11px;box-shadow:var(--sh-card);
  display:grid;grid-template-columns:56px 1fr;gap:13px;align-items:start;
}
.row--ready{background:linear-gradient(180deg,#FFFBEF 0%,#FFFFFF 62%);border-color:#F4DFA6;box-shadow:var(--sh-lift)}
.row--empty{background:var(--paper);border-style:dashed;border-color:#E4DAC6;box-shadow:none}
.row__body{min-width:0;padding-top:2px}
.row__head{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.row__name{font-family:var(--disp);font-weight:800;font-size:17.5px;line-height:1;margin:0;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.row__hint{font-size:12px;font-weight:700;color:var(--ink-35);margin:9px 0 0}

/* avatar */
.av{
  width:56px;height:56px;border-radius:999px;display:grid;place-items:center;
  font-family:var(--disp);font-weight:800;font-size:22px;color:var(--ink);
  box-shadow:0 0 0 3px var(--paper), 0 0 0 5.5px var(--butter);
  position:relative;
}
.av--sm{width:44px;height:44px;font-size:17px;box-shadow:0 0 0 2.5px var(--paper), 0 0 0 4.5px var(--butter)}
.av--xs{width:34px;height:34px;font-size:14px;box-shadow:0 0 0 2px var(--paper), 0 0 0 3.5px var(--butter)}
.av--lg{width:72px;height:72px;font-size:27px;box-shadow:0 0 0 3px var(--paper), 0 0 0 5px var(--sand)}
.av--none{background:#FAF5EA;color:var(--ink-35);box-shadow:none;border:2px dashed #E0D4BC}

/* count chip */
.chip{
  font-family:var(--body);font-weight:800;font-size:12.5px;flex:none;
  padding:5px 11px;border-radius:999px;background:var(--sand);color:var(--ink-70);
  letter-spacing:.01em;line-height:1;white-space:nowrap;
}
.chip--zero{background:#F6F1E7;color:var(--ink-35)}
.chip--gold{background:var(--honey);color:var(--ink);box-shadow:0 1px 0 rgba(150,96,4,.2)}

/* ---- THE BAR ---- */
.bar{
  height:16px;border-radius:999px;background:var(--sand);
  position:relative;overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(35,57,91,.07);
}
.bar__fill{
  position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--blue);
  box-shadow:inset 0 -2px 0 rgba(35,57,91,.07);
}
.bar__ticks{position:absolute;inset:0;display:flex;pointer-events:none}
.bar__ticks i{flex:1;border-right:2px solid rgba(255,255,255,.62)}
.bar__ticks i:last-child{border-right:none}
.bar--empty{background:transparent;box-shadow:none;border:2px dashed #E0D4BC}
.bar--empty .bar__ticks{display:none}
.bar--gold .bar__fill{
  background:linear-gradient(180deg,#F2B437 0%,var(--honey) 100%);
  box-shadow:inset 0 -2px 0 rgba(150,96,4,.22);
}
.bar--gold .bar__ticks i{border-right-color:rgba(255,253,246,.5)}
.bar--cooking .bar__fill{
  background:repeating-linear-gradient(115deg,#F2B437 0 12px,#E8A317 12px 24px);
  opacity:.72;
}

/* celebrate sparkles — own box, never overlaps the chip */
.sparks{position:relative;width:22px;height:20px;flex:none;margin-right:2px}
.sparks i{position:absolute;background:var(--butter);border-radius:1.5px}
.sparks i:nth-child(1){width:7px;height:7px;left:1px;top:1px;transform:rotate(20deg)}
.sparks i:nth-child(2){width:5px;height:5px;left:12px;top:-3px;background:var(--honey);transform:rotate(42deg)}
.sparks i:nth-child(3){width:5px;height:5px;left:8px;top:12px;background:var(--honey);opacity:.55;transform:rotate(-16deg)}

/* row action / status */
.rowact{margin-top:11px}
.status{
  margin-top:11px;display:flex;align-items:center;gap:9px;
  background:var(--sky);border-radius:14px;padding:9px 12px;
}
.status--gold{background:var(--butter-soft)}
.status__t{font-size:13px;font-weight:800;color:var(--ink);flex:1;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status__m{font-size:12px;font-weight:700;color:var(--ink-50);white-space:nowrap}
.dots{display:inline-flex;gap:3px;align-items:center}
.dots i{width:5px;height:5px;border-radius:999px;background:var(--honey-deep)}
.dots i:nth-child(2){opacity:.6}
.dots i:nth-child(3){opacity:.3}
.tick{
  width:22px;height:22px;border-radius:999px;background:var(--blue);flex:none;
  display:grid;place-items:center;box-shadow:0 1px 0 rgba(35,57,91,.1);
}
.watch{
  font-family:var(--disp);font-weight:800;font-size:13.5px;color:var(--honey-deep);
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
}

/* ---- tag screen ---- */
.photocard{
  border-radius:var(--r-card);overflow:hidden;position:relative;
  border:1.5px solid var(--sand-line);box-shadow:var(--sh-card);background:var(--sky);
}
.photocard__chip{
  position:absolute;left:12px;top:12px;background:rgba(255,253,246,.94);
  font-size:11.5px;font-weight:800;color:var(--ink);padding:5px 11px 5px 9px;border-radius:999px;
  box-shadow:0 2px 8px rgba(35,57,91,.14);
  display:flex;align-items:center;gap:5px;
}
.facegrid{margin-bottom:4px}
.q{font-family:var(--disp);font-weight:800;font-size:23px;margin:20px 2px 4px;letter-spacing:-.015em}
.qsub{font-size:13px;font-weight:700;color:var(--ink-50);margin:0 2px 16px}
.facegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px}
.face{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.face__av{position:relative}
.face__av .av{transition:.15s}
.face--on .av{box-shadow:0 0 0 3px var(--paper), 0 0 0 6.5px var(--honey)}
.face__badge{
  position:absolute;right:-3px;bottom:-3px;width:26px;height:26px;border-radius:999px;
  background:var(--butter);border:2.5px solid var(--paper);display:grid;place-items:center;
  box-shadow:0 2px 6px rgba(35,57,91,.2);
}
.face__n{font-size:12.5px;font-weight:700;color:var(--ink-50);text-align:center;line-height:1.1}
.face--on .face__n{font-weight:800;color:var(--ink)}
.footbar{
  position:sticky;bottom:0;background:rgba(255,253,246,.95);backdrop-filter:blur(12px);
  border-top:1px solid var(--sand-line);
  padding:13px 16px calc(15px + env(safe-area-inset-bottom));
  display:flex;gap:10px;
}

/* ---- parent login ---- */
.login{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 28px calc(70px + env(safe-area-inset-bottom));text-align:center;position:relative;
}
.halo{
  position:relative;width:196px;height:196px;display:grid;place-items:center;margin-bottom:6px;
}
.halo::before{
  content:"";position:absolute;inset:0;border-radius:999px;z-index:0;
  background:radial-gradient(circle at 50% 48%, rgba(255,224,150,.55) 0%, rgba(255,224,150,0) 68%);
}
.halo::after{
  content:"";position:absolute;inset:6px;border-radius:999px;z-index:0;
  border:2px dashed rgba(232,163,23,.24);
}
.halo > svg{position:relative;z-index:1}
.wordmark{font-family:var(--disp);font-weight:800;font-size:36px;letter-spacing:-.025em;margin:2px 0 0;line-height:1}
.wordrule{width:58px;height:5px;border-radius:999px;background:var(--honey);margin:11px auto 0}
.logintag{font-size:13.5px;font-weight:700;color:var(--ink-50);margin:12px 0 30px;line-height:1.5}
.codeboxes{display:flex;gap:8px;justify-content:center;margin-bottom:26px}
.cbox{
  width:46px;height:60px;border-radius:var(--r-tile);background:var(--paper);
  border:2px solid var(--sand-line);display:grid;place-items:center;
  font-family:var(--disp);font-weight:800;font-size:27px;color:var(--ink);
  box-shadow:0 1px 0 rgba(35,57,91,.04);
}
.cbox--on{border-color:var(--blue);background:#FBFEFF}
.cbox--cur{border-color:var(--honey);box-shadow:0 0 0 4px rgba(232,163,23,.14)}
.caret{width:2px;height:26px;background:var(--honey);border-radius:2px}
.helper{font-size:13px;font-weight:700;color:var(--ink-50);margin:16px 0 0;line-height:1.55;max-width:250px}
.byline{
  position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom));
  font-size:11px;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-35);
}

/* ---- parent feed ---- */
.greet{margin:20px 2px 18px}
.greet h2{font-family:var(--disp);font-weight:800;font-size:26px;line-height:1.14;margin:0;letter-spacing:-.02em}
.greet p{margin:7px 0 0;font-size:13.5px;font-weight:700;color:var(--ink-50)}
.mcard{
  background:var(--paper);border:1.5px solid var(--sand-line);border-radius:var(--r-card);
  padding:13px;margin-bottom:16px;box-shadow:var(--sh-card);
}
.mcard__top{display:flex;align-items:center;gap:8px;margin:1px 3px 12px}
.mcard__wk{font-family:var(--disp);font-weight:800;font-size:15px;flex:1;letter-spacing:-.005em}
.newbadge{
  background:var(--butter);color:var(--ink);font-size:10.5px;font-weight:800;
  letter-spacing:.1em;padding:4px 9px;border-radius:999px;
}
.player{
  background:var(--sky);border-radius:18px;padding:14px;display:grid;place-items:center;
  border:1px solid #DCEDF8;
}
.frame916{
  width:196px;aspect-ratio:9/16;border-radius:14px;position:relative;overflow:hidden;
  box-shadow:0 3px 0 rgba(35,57,91,.06), 0 18px 30px -20px rgba(35,57,91,.5);
}
.playbtn{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:58px;height:58px;border-radius:999px;background:var(--honey);
  display:grid;place-items:center;
  box-shadow:0 0 0 5px rgba(255,253,246,.55), 0 3px 0 rgba(150,96,4,.2), 0 10px 20px -10px rgba(35,57,91,.4);
}
.mcard__meta{display:flex;align-items:center;gap:8px;margin:12px 3px 12px;font-size:12.5px;font-weight:700;color:var(--ink-50)}
.mcard__meta b{color:var(--ink-70);font-weight:800}
.dotsep{width:3px;height:3px;border-radius:999px;background:var(--ink-35)}

/* ---- teacher extras ---- */
.hgroup{margin:22px 2px 12px}
.hgroup h2{font-family:var(--disp);font-weight:800;font-size:18px;margin:0;letter-spacing:-.01em}
.hgroup p{margin:4px 0 0;font-size:12.5px;font-weight:700;color:var(--ink-50)}
.lrow{
  background:var(--paper);border:1.5px solid var(--sand-line);border-radius:20px;
  padding:11px 13px;margin-bottom:9px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh-card);
}
.lrow__n{font-family:var(--disp);font-weight:800;font-size:16px;flex:1;min-width:0;line-height:1.15}
.lrow__n small:empty{display:none}
.lrow__n small{display:block;font-family:var(--body);font-weight:700;font-size:11.5px;color:var(--ink-35);margin-top:2px}
.addrow{
  border:2px dashed #E4DAC6;border-radius:20px;padding:14px;display:flex;align-items:center;
  justify-content:center;gap:9px;font-family:var(--disp);font-weight:800;font-size:15px;color:var(--ink-50);
  cursor:pointer;background:rgba(255,255,255,.5);
}
.code{
  font-family:var(--mono);font-weight:700;font-size:19px;letter-spacing:.14em;color:var(--ink);
  background:var(--sky);border-radius:12px;padding:8px 12px 8px 14px;line-height:1;
}
.segment{display:flex;background:var(--sand);border-radius:999px;padding:4px;gap:3px;margin:0 2px}
.segment button{
  flex:1 1 0;border:none;background:transparent;border-radius:999px;padding:9px 8px;cursor:pointer;
  font-family:var(--disp);font-weight:800;font-size:14px;color:var(--ink-50);
}
.segment button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 0 rgba(35,57,91,.06), 0 4px 10px -6px rgba(35,57,91,.4)}

/* ============================================================
   TOKENS SHEET
   ============================================================ */
.sheet{display:grid;gap:34px}
.panel{
  background:var(--paper);border:1.5px solid var(--sand-line);border-radius:26px;
  padding:26px 28px 30px;box-shadow:var(--sh-card);
}
.panel__h{
  display:flex;align-items:baseline;gap:14px;margin:0 0 20px;padding-bottom:14px;
  border-bottom:1px solid var(--sand-line);
}
.panel__h h3{font-family:var(--disp);font-weight:800;font-size:19px;margin:0;letter-spacing:-.01em}
.panel__h span{font-family:var(--mono);font-size:11px;color:var(--ink-35);letter-spacing:.06em}
.panel__h em{
  margin-left:auto;font-style:normal;font-size:12px;font-weight:700;color:var(--ink-50);
}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
.sw__c{height:76px;border-radius:16px;border:1px solid rgba(35,57,91,.16);
  box-shadow:inset 0 -14px 20px -18px rgba(35,57,91,.5)}
.sw__n{font-family:var(--disp);font-weight:800;font-size:14px;margin:10px 0 1px}
.sw__x{font-family:var(--mono);font-size:11.5px;color:var(--ink-50);letter-spacing:.04em}
.sw__u{font-size:11.5px;font-weight:700;color:var(--ink-35);margin-top:5px;line-height:1.4}
.typerow{display:flex;align-items:baseline;gap:20px;padding:13px 0;border-bottom:1px dashed var(--sand-line)}
.typerow:last-child{border-bottom:none}
.typerow__s{flex:1;min-width:0;color:var(--ink)}
.typerow__m{font-family:var(--mono);font-size:11px;color:var(--ink-35);text-align:right;white-space:nowrap;line-height:1.6}
.barstates{display:grid;gap:16px}
.barstate{display:grid;grid-template-columns:126px 1fr auto;gap:16px;align-items:center}
.barstate__l{font-size:12.5px;font-weight:800;color:var(--ink-70)}
.barstate__l small{display:block;font-weight:700;color:var(--ink-35);font-size:11px;margin-top:2px}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.shapes{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.shape{text-align:center}
.shape__b{background:var(--butter-soft);border:1.5px solid #F3E2B6;width:92px;height:66px}
.shape__l{font-family:var(--mono);font-size:11px;color:var(--ink-50);margin-top:8px}
.mascotshow{display:flex;gap:36px;align-items:flex-end;flex-wrap:wrap}
.mascotshow figcaption{font-family:var(--mono);font-size:11px;color:var(--ink-35);margin-top:12px;text-align:center}
.mascotshow figure{margin:0}

/* ============================================================
   v1.1 — MULTI-FRAME SHEET
   ============================================================ */
.tab .v{
  margin-left:8px;font-size:9.5px;font-weight:800;letter-spacing:.08em;
  background:var(--butter);color:var(--ink);padding:2px 6px;border-radius:999px;vertical-align:1px;
}
.tab.on .v{background:var(--butter);color:var(--ink)}
.notes--wide{
  max-width:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:6px 44px;margin-top:44px;padding-top:30px;border-top:1px solid var(--sand-line);
}
.lbl-note{
  font-size:11px;font-weight:800;letter-spacing:.02em;color:var(--ink-35);
  margin:8px 4px 18px;display:flex;align-items:center;gap:7px;
}
.lbl-note::before{content:"";width:14px;height:1.5px;background:var(--butter);flex:none}
.orderlist{margin:0;padding:0 0 0 20px;list-style:decimal}
.orderlist li{font-size:12.5px;font-weight:700;color:var(--ink-70);line-height:1.65;padding-left:2px}
.orderlist li b{color:var(--ink);font-weight:800}
.newtag{
  position:absolute;left:8px;top:8px;z-index:2;background:var(--butter);color:var(--ink);
  font-size:9.5px;font-weight:800;letter-spacing:.12em;padding:4px 9px;border-radius:999px;
  box-shadow:0 2px 6px rgba(35,57,91,.22);
}
.frames{display:flex;gap:26px;align-items:flex-start;flex-wrap:nowrap}
.fr{display:flex;flex-direction:column;flex:none;width:390px;margin:0}
.fr__cap{
  display:flex;align-items:center;gap:9px;margin:0 6px 13px;
  font-size:12.5px;font-weight:800;color:var(--ink-50);line-height:1.3;
}
.fr__cap b{
  width:23px;height:23px;border-radius:999px;background:var(--ink);color:var(--cream);
  display:grid;place-items:center;font-family:var(--disp);font-size:12px;flex:none;font-weight:800;
}
.fr__screen{
  width:390px;min-height:844px;border-radius:34px;overflow:hidden;background:var(--cream);
  border:1px solid var(--sand-line);display:flex;
  box-shadow:0 2px 0 rgba(35,57,91,.04), 0 30px 54px -40px rgba(35,57,91,.55);
}
.fr__screen .app{min-height:844px;flex:1;width:100%}
.fr__screen--fixed .app{min-height:0;height:100%}
.fr__screen--fixed .scroll{overflow:hidden}
.fr__screen--fixed{position:relative}
.fr__screen .appsheet{flex:1;width:100%;min-height:844px;padding:18px 16px 24px;background:var(--cream)}

/* ============================================================
   v1.1 — CLASS FILM PICKER
   ============================================================ */
.cfhead{
  position:sticky;top:0;z-index:20;background:rgba(255,253,246,.97);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--sand-line);padding:calc(13px + env(safe-area-inset-top)) 16px 13px;
}
.cfhead__top{display:flex;align-items:center;gap:12px}
.cfhead__t{font-family:var(--disp);font-weight:800;font-size:18px;line-height:1.1;margin:0;flex:1;letter-spacing:-.012em}
.cfhead__t small{
  display:block;font-family:var(--body);font-weight:800;font-size:11.5px;
  color:var(--blue-deep);margin-top:3px;letter-spacing:0;
}
.cfcount{display:flex;align-items:flex-end;gap:9px;margin:14px 2px 0}
.cfcount__n{font-family:var(--disp);font-weight:800;font-size:31px;line-height:.86;letter-spacing:-.03em}
.cfcount__u{font-family:var(--body);font-weight:800;font-size:13px;color:var(--ink-50);padding-bottom:1px}
.cfcount__d{
  margin-left:auto;background:var(--sky);color:var(--blue-deep);font-weight:800;font-size:12.5px;
  padding:5px 11px;border-radius:999px;line-height:1.1;
}
.guide{margin:12px 2px 0;position:relative;height:26px}
.guide__track{height:8px;border-radius:999px;background:var(--sand);position:relative}
.guide__zone{position:absolute;top:0;bottom:0;background:var(--blue);border-radius:999px;opacity:.7}
.guide__pin{
  position:absolute;top:4px;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:999px;
  background:var(--honey);border:3px solid var(--cream);box-shadow:0 1px 0 rgba(150,96,4,.3);
}
.guide__tick{
  position:absolute;top:13px;transform:translateX(-50%);
  font-size:10px;font-weight:800;color:var(--ink-35);letter-spacing:.02em;white-space:nowrap;
}

/* coverage strip */
.cover{margin-top:15px}
.cover__h{display:flex;align-items:baseline;gap:8px;margin:0 2px 10px}
.cover__h h4{font-family:var(--disp);font-weight:800;font-size:13.5px;margin:0;letter-spacing:-.005em}
.cover__h span{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-35);margin-left:auto}
.cover__wrap{position:relative;margin:0 -16px;padding:0 16px}
.cover__wrap::after{
  content:"";position:absolute;right:0;top:0;bottom:0;width:38px;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,253,246,0),var(--cream) 78%);
}
.cover__strip{
  display:grid;grid-auto-flow:column;grid-template-rows:auto auto;gap:13px 9px;
  overflow-x:auto;padding-bottom:2px;scrollbar-width:none;
}
.cover__strip::-webkit-scrollbar{display:none}
.cchip{width:50px;text-align:center;cursor:pointer}
.cchip__w{position:relative;width:44px;height:44px;margin:0 auto}
.cchip__av{
  width:44px;height:44px;border-radius:999px;display:grid;place-items:center;
  font-family:var(--disp);font-weight:800;font-size:17px;color:var(--ink);
}
.cchip--cov .cchip__av{box-shadow:0 0 0 2.5px var(--cream), 0 0 0 5px var(--honey)}
.cchip--miss .cchip__av{
  background:#FFF7E3 !important;color:rgba(201,134,11,.85);
  border:2px dashed var(--honey);box-shadow:0 0 0 5px rgba(232,163,23,.11);
}
.cchip--exc .cchip__av{filter:grayscale(1);opacity:.45;box-shadow:0 0 0 2.5px var(--cream), 0 0 0 4px var(--sand)}
.cchip--filter .cchip__av{box-shadow:0 0 0 2.5px var(--cream), 0 0 0 5px var(--ink)}
.cchip__b{
  position:absolute;right:-6px;bottom:-4px;min-width:20px;height:20px;padding:0 5px;
  border-radius:999px;font-family:var(--body);font-weight:800;font-size:11px;line-height:1;
  display:grid;place-items:center;border:2.5px solid var(--cream);
  background:var(--honey);color:var(--ink);
}
.cchip--miss .cchip__b{background:var(--cream);color:var(--honey-deep);border-color:var(--honey);border-style:dashed;border-width:1.5px;box-shadow:0 0 0 2.5px var(--cream)}
.cchip--exc .cchip__b{background:var(--sand);color:var(--ink-50);font-size:9px;letter-spacing:.02em}
.cchip__n{
  font-size:10px;font-weight:800;color:var(--ink-50);margin-top:8px;line-height:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cchip--miss .cchip__n{color:var(--honey-deep)}
.cchip--exc .cchip__n{color:var(--ink-35)}
.cchip--filter .cchip__n{color:var(--ink)}

/* summary pill / filter bar / excuse sheet */
.cfsum{
  display:flex;align-items:center;gap:10px;margin:13px 0 0;padding:8px 12px 8px 10px;
  border-radius:17px;background:var(--butter-soft);border:1px solid #F3E2B6;
}
.cfsum--ok{background:var(--sky);border-color:#DAEBF7}
.cfsum--ok .tick{background:var(--butter);box-shadow:0 1px 0 rgba(150,96,4,.25)}
.cfsum__t{flex:1;font-size:12.5px;font-weight:800;color:var(--ink);line-height:1.3}
.cfsum__t small{display:block;font-weight:700;font-size:11px;color:var(--ink-50);margin-top:2px}
.cfsum__a{font-size:12.5px;font-weight:800;color:var(--honey-deep);white-space:nowrap;display:flex;align-items:center;gap:4px}
.stackav{display:flex;flex:none}
.stackav i{
  width:24px;height:24px;border-radius:999px;display:grid;place-items:center;
  font-family:var(--disp);font-weight:800;font-size:11px;color:var(--ink);
  border:2px solid var(--butter-soft);margin-right:-8px;font-style:normal;
}
.cfsum--ok .stackav i{border-color:#FFFBEE}
.stackav i:last-child{margin-right:0}
.cffilter{
  display:flex;align-items:center;gap:10px;margin:13px 0 0;padding:7px 8px 7px 10px;
  border-radius:17px;background:var(--sky);border:1px solid #DAEBF7;
}
.cffilter__t{flex:1;font-size:12.5px;font-weight:800;color:var(--ink);line-height:1.25}
.cffilter__x{
  display:flex;align-items:center;gap:6px;background:var(--paper);border:1.5px solid #DAEBF7;
  border-radius:999px;padding:6px 11px;font-size:12px;font-weight:800;color:var(--blue-deep);white-space:nowrap;
}
.excuse{
  margin:13px 0 0;padding:13px;border-radius:20px;background:var(--paper);
  border:2px dashed var(--honey);box-shadow:var(--sh-card);
}
.excuse__top{display:flex;gap:12px;align-items:center}
.excuse__t{font-family:var(--disp);font-weight:800;font-size:15.5px;line-height:1.2;letter-spacing:-.01em}
.excuse__s{font-size:12px;font-weight:700;color:var(--ink-50);margin-top:4px;line-height:1.4}
.excuse__btns{display:flex;gap:9px;margin-top:13px}
.excuse__btns .btn{flex:1}

/* photo grid */
.daylabel{
  display:flex;align-items:center;gap:10px;margin:17px 2px 10px;
  font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-35);
}
.daylabel::after{content:"";flex:1;height:1px;background:var(--sand-line)}
.daylabel:first-child{margin-top:4px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pth{
  position:relative;border-radius:var(--r-tile);overflow:hidden;background:var(--sky);
  border:1.5px solid var(--sand-line);aspect-ratio:1/1;cursor:pointer;
}
.pth svg{display:block;width:100%;height:100%}
.pth--on{
  border:3px solid var(--honey);
  box-shadow:0 2px 0 rgba(150,96,4,.14), 0 10px 18px -12px rgba(232,163,23,.9);
}
.pth__star{
  position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:999px;
  display:grid;place-items:center;background:rgba(255,253,246,.88);
  box-shadow:0 1px 4px rgba(35,57,91,.2);
}
.pth--on .pth__star{background:var(--honey);box-shadow:0 1px 0 rgba(150,96,4,.35), 0 2px 8px rgba(35,57,91,.2)}
.pth__faces{
  position:absolute;left:6px;bottom:6px;display:flex;align-items:center;gap:3px;
  background:rgba(255,253,246,.92);padding:3px 7px 3px 4px;border-radius:999px;
  box-shadow:0 1px 3px rgba(35,57,91,.16);
}
.pth__faces i{width:11px;height:11px;border-radius:999px;display:block;flex:none}
.pth__faces span{font-size:9.5px;font-weight:800;color:var(--ink-50);line-height:1}
.cffoot{
  position:sticky;bottom:0;background:rgba(255,253,246,.97);backdrop-filter:blur(12px);
  border-top:1px solid var(--sand-line);padding:11px 16px calc(14px + env(safe-area-inset-bottom));
}
.cffoot__hint{font-size:11.5px;font-weight:700;color:var(--ink-50);text-align:center;margin:0 0 9px;line-height:1.4}
.cffoot::before{
  content:"";position:absolute;left:0;right:0;bottom:100%;height:34px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,253,246,0),var(--cream));
}

/* ============================================================
   v1.1 — CLASS FILM CARD (board)
   ============================================================ */
.filmcard{
  background:linear-gradient(180deg,#FFFCF2 0%,#FFFFFF 62%);
  border:1.5px solid #F0E3C6;border-radius:var(--r-card);
  padding:12px 13px;margin-top:12px;box-shadow:var(--sh-card);
  display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;cursor:pointer;
}
.filmcard__ic{
  width:46px;height:46px;border-radius:16px;background:var(--sky);
  display:grid;place-items:center;border:1.5px solid #DAEBF7;
}
.filmcard__t{font-family:var(--disp);font-weight:800;font-size:15.5px;line-height:1.15;letter-spacing:-.008em}
.filmcard__s{font-size:12px;font-weight:700;color:var(--ink-50);margin-top:4px;line-height:1.3}
.filmcard__cta{
  font-family:var(--disp);font-weight:800;font-size:13px;color:var(--honey-deep);
  display:flex;align-items:center;gap:5px;white-space:nowrap;
}
.filmcard__stripe{grid-column:1/-1;height:9px;border-radius:999px;margin-top:2px;
  background:repeating-linear-gradient(115deg,#F2B437 0 11px,#E8A317 11px 22px);opacity:.78}
.filmcard--cook{background:linear-gradient(180deg,#FFF7E0 0%,#FFFBEF 70%);border-color:#F0DCA6}
.filmcard--cook .filmcard__ic{background:rgba(255,255,255,.85);border-color:#F0DCA6}
.filmcard--sent{background:var(--paper)}

/* ============================================================
   v1.1 — WHITE-LABEL BRANDING
   ============================================================ */
.logoph{
  border-radius:999px;background:var(--sky);border:1.5px solid #D5E8F5;
  display:grid;place-items:center;font-family:var(--disp);font-weight:800;color:var(--blue-deep);
  letter-spacing:.02em;
}
.schoolhero{display:flex;flex-direction:column;align-items:center}
.schoolname{font-family:var(--disp);font-weight:800;font-size:27px;letter-spacing:-.022em;margin:16px 0 0;line-height:1.1;text-align:center}
.schoolsub{font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-35);margin:9px 0 0}
.madewith{
  position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));
  display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:11.5px;font-weight:800;color:var(--ink-35);letter-spacing:.01em;
}
.brandbar{
  display:flex;align-items:center;gap:11px;padding:13px 16px;
  background:rgba(255,253,246,.96);border-bottom:1px solid var(--sand-line);
}
.brandbar__s{font-family:var(--disp);font-weight:800;font-size:15px;line-height:1.1;letter-spacing:-.01em}
.brandbar__c{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11.5px;font-weight:800;color:var(--ink-50)}
.previewcard{
  border:1.5px dashed #E0D4BC;border-radius:22px;padding:12px;background:rgba(255,255,255,.55);margin-bottom:12px;
}
.previewcard__l{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-35);margin:0 2px 9px}
.previewcard__in{border-radius:16px;overflow:hidden;border:1px solid var(--sand-line);background:var(--cream)}
.lockchip{
  display:inline-flex;align-items:center;gap:5px;background:var(--sand);color:var(--ink-50);
  font-size:10px;font-weight:800;padding:5px 9px;border-radius:999px;white-space:nowrap;flex:none;
}
.filternote{
  margin:18px 2px 4px;padding:13px;border-radius:18px;border:1.5px dashed #E0D4BC;
  background:rgba(255,255,255,.55);text-align:center;
  font-size:12.5px;font-weight:800;color:var(--ink-50);line-height:1.45;
}
.filternote small{display:block;font-weight:700;color:var(--ink-35);margin-top:4px;font-size:11.5px}
/* montage end card */
.endwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:24px 16px}
.end916{
  width:300px;aspect-ratio:9/16;border-radius:22px;overflow:hidden;position:relative;
  background:
    radial-gradient(150% 80% at 50% 12%, #FFF6DF 0%, rgba(255,246,223,0) 62%),
    radial-gradient(120% 70% at 50% 100%, #EAF6FD 0%, rgba(234,246,253,0) 58%),
    var(--cream);
  box-shadow:0 3px 0 rgba(35,57,91,.06), 0 34px 56px -32px rgba(35,57,91,.6);
  border:1px solid var(--sand-line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.end916::before{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(35,57,91,.085) 1px, transparent 1px);background-size:15px 15px;
  mask-image:radial-gradient(74% 48% at 50% 47%, rgba(0,0,0,0) 46%, rgba(0,0,0,1));
  -webkit-mask-image:radial-gradient(74% 48% at 50% 47%, rgba(0,0,0,0) 46%, rgba(0,0,0,1));
}
.endsafe{
  position:relative;width:272px;aspect-ratio:16/9;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
}
.endsafe::before{content:"";position:absolute;inset:0;border:1.5px dashed rgba(35,57,91,.16);border-radius:14px}
.endsafe__tag{
  position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--cream);
  padding:0 8px;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-35);
}
.endname{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:-.02em;margin:9px 0 0;line-height:1.05}
.endrule{width:34px;height:3px;border-radius:999px;background:var(--honey);margin:8px 0}
.endclass{display:flex;align-items:center;gap:6px;font-family:var(--disp);font-weight:800;font-size:13px}
.endweek{font-size:10.5px;font-weight:800;color:var(--ink-50);margin-top:5px;letter-spacing:.03em}
.endfoot{
  position:absolute;left:0;right:0;bottom:14px;text-align:center;
  font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-35);
}

/* ============================================================
   v1.1 — PARENT FEED v2
   ============================================================ */
.mcard--class{
  background:linear-gradient(180deg,#FFFBEE 0%,#FFFFFF 55%);
  border-color:#F0E3C6;box-shadow:var(--sh-lift);
}
.mcard__brand{display:flex;align-items:center;gap:9px;margin:2px 3px 11px}
.mcard__brand .t{flex:1;min-width:0}
.mcard__brand .t b{display:block;font-family:var(--disp);font-weight:800;font-size:15px;line-height:1.15;letter-spacing:-.008em}
.mcard__brand .t small{display:block;font-size:11.5px;font-weight:700;color:var(--ink-50);margin-top:2px}
.kindpill{
  font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  padding:5px 9px;border-radius:999px;background:var(--honey);color:var(--ink);white-space:nowrap;
}
.kindpill--child{background:var(--blue)}
.player--class{background:var(--butter-soft);border-color:#F3E2B6}
.player--class .frame916{width:214px}
.everyone{
  display:flex;align-items:center;gap:8px;margin:12px 3px 0;font-size:12px;font-weight:800;color:var(--honey-deep);
}

/* ============================================================
   v1.1 — LIGHTBOX
   ============================================================ */
.lb{flex:1;display:flex;flex-direction:column;background:#1B2C47;position:relative}
.lb__bar{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 14px 10px}
.lb__ic{width:38px;height:38px;flex:none;border-radius:13px;background:rgba(255,253,246,.13);display:grid;place-items:center}
.lb__ic--danger{background:rgba(255,123,107,.18)}
.lb__t{flex:1;text-align:center;min-width:0}
.lb__t b{display:block;font-family:var(--disp);font-weight:800;font-size:15px;color:#FFFDF6;line-height:1.1}
.lb__t small{display:block;font-size:10.5px;font-weight:800;color:rgba(255,253,246,.5);margin-top:3px;letter-spacing:.06em}
.lb__stage{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 14px;position:relative}
.lb__photo{width:100%;border-radius:22px;overflow:hidden;box-shadow:0 26px 50px -26px rgba(0,0,0,.85);border:1px solid rgba(255,253,246,.1)}
.lb__nav{
  position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:999px;
  background:rgba(27,44,71,.42);display:grid;place-items:center;backdrop-filter:blur(6px);z-index:3;
  box-shadow:0 2px 10px rgba(0,0,0,.28);border:1px solid rgba(255,253,246,.16);
}
.lb__ic--danger{background:rgba(255,123,107,.24)}
.lbdots{display:flex;gap:5px;justify-content:center;align-items:center;margin:16px 0 0}
.lbdots i{width:6px;height:6px;border-radius:999px;background:rgba(255,253,246,.28)}
.lbdots i.on{background:var(--butter);width:20px}
.lb__foot{padding:10px 16px calc(18px + env(safe-area-inset-bottom))}
.lb__who{background:rgba(255,253,246,.09);border:1px solid rgba(255,253,246,.1);border-radius:20px;padding:12px}
.lb__lbl{font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,253,246,.5);margin:0 0 10px}
.lb__faces{display:flex;gap:14px}
.lb__face{display:flex;flex-direction:column;align-items:center;gap:6px}
.lb__face span{font-size:11px;font-weight:800;color:rgba(255,253,246,.82)}
.lb__add{
  width:38px;height:38px;border-radius:999px;border:2px dashed rgba(255,253,246,.28);
  display:grid;place-items:center;
}

/* bare (screenshot) mode */
.bare .specbar,.bare .stage__head,.bare .notes,.bare .device__cap{display:none}
.bare .canvas{background:var(--cream)}
.bare .canvas::before{display:none}
.bare .stage{padding:0;max-width:none}
.bare .device{width:100%;padding:0;border:none;border-radius:0;box-shadow:none}
.bare .device__screen{width:100%;min-height:100vh;border-radius:0}
.bare .devicewrap{padding:0}
.bare .split{display:block}
.bare .frames{padding:28px;background:var(--cream);width:max-content}
.bare .fr__screen{box-shadow:0 2px 0 rgba(35,57,91,.04), 0 26px 46px -38px rgba(35,57,91,.5)}

/* ============================================================
   v1.2 — WARMTH / DELIGHT / DEPTH PASS
   Skin + soul only: no flow, layout or palette-family changes.
   ============================================================ */
:root{
  /* faint warm paper grain, composited INTO the cream (never over content) */
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.16'/></svg>");
  /* two-layer shadow: a tight contact edge + a wide ambient fall */
  --sh-card:0 1px 1.5px rgba(35,57,91,.07), 0 12px 24px -14px rgba(35,57,91,.30);
  --sh-lift:0 2px 3px rgba(35,57,91,.09), 0 20px 34px -18px rgba(35,57,91,.40);
  --sh-gold:0 2px 3px rgba(150,96,4,.22), 0 18px 30px -14px rgba(232,163,23,.62);
  --sh-photo:0 1px 2px rgba(35,57,91,.13), 0 8px 16px -9px rgba(35,57,91,.40);
}
.canvas{background-image:
  var(--grain),
  radial-gradient(1100px 620px at 12% -8%, #FFF3D6 0%, rgba(255,243,214,0) 62%),
  radial-gradient(900px 560px at 96% 4%, #E7F4FD 0%, rgba(231,244,253,0) 60%);
  background-blend-mode:soft-light,normal,normal;
}
.app{
  background-color:var(--cream);
  background-image:var(--grain);
  background-blend-mode:soft-light;
}

/* ---- cards read as thick paper, not flat rectangles ------- */
.row,.mcard,.lrow,.filmcard,.photocard,.panel,.previewcard{
  border-bottom-width:2.5px;border-bottom-color:#E7DAC0;
}

/* ---- PHOTOS ARE THE PRODUCT: scrapbook treatment ---------- */
.pgrid{gap:11px}
.pth{
  background:#FFFDF6;border:none;padding:4px;overflow:hidden;
  box-shadow:var(--sh-photo);
  transition:transform .18s ease;
}
.pth svg{border-radius:11px}
.pth:nth-child(3n+1){transform:rotate(-1.5deg)}
.pth:nth-child(3n+2){transform:rotate(.7deg)}
.pth:nth-child(3n+3){transform:rotate(1.4deg)}
.pth--on{
  border:none;padding:4px;
  background:#FFFDF6;
  box-shadow:0 0 0 3px var(--honey), 0 2px 3px rgba(150,96,4,.20), 0 12px 20px -10px rgba(232,163,23,.75);
}
/* washi tape across the top-left corner of a starred photo */
.pth--on::before{
  content:"";position:absolute;left:-10px;top:5px;width:30px;height:9px;z-index:3;
  background:linear-gradient(180deg,rgba(255,233,174,.92) 0%,rgba(255,212,102,.92) 60%,rgba(242,190,69,.92) 100%);
  transform:rotate(-40deg);
  box-shadow:0 1px 2px rgba(35,57,91,.16);
}
.pth__star{width:28px;height:28px;right:7px;top:7px}
.pth__faces{left:7px;bottom:7px}

/* ---- the montage frame: a still lifted out of the film ---- */
.still{position:absolute;inset:0}
.still svg{width:100%;height:100%;display:block}
.still__scrim{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(35,57,91,0) 56%,rgba(35,57,91,.40) 100%);
}
.still__cap{
  position:absolute;left:9px;bottom:8px;color:#FFFDF6;font-size:10px;font-weight:800;
  letter-spacing:.11em;text-transform:uppercase;text-shadow:0 1px 4px rgba(0,0,0,.45);
}
.frame916{box-shadow:0 2px 4px rgba(35,57,91,.16), 0 22px 34px -20px rgba(35,57,91,.62)}

/* ---- tag screen preview is a real 4:3 photo --------------- */
.photocard{aspect-ratio:4/3;background:var(--sky);padding:6px;border-radius:22px;background:#FFFDF6}
.photocard svg{width:100%;height:100%;display:block;border-radius:17px}
.photocard__chip{left:16px;top:16px;white-space:nowrap}

/* ---- lightbox photo ---------------------------------------- */
.lb__photo{aspect-ratio:4/3;background:#FFFDF6;padding:7px;border-radius:24px}
.lb__photo svg{width:100%;height:100%;display:block;border-radius:18px}

/* ---- DELIGHT 1: sunshine burst on "everyone's in the film" -- */
.cfsum--ok,
.everyone{
  position:relative;overflow:hidden;
  padding:11px 13px;border-radius:16px;font-size:13px;
  background:radial-gradient(120px 60px at 16% 50%, #FFF0C6 0%, rgba(255,240,198,0) 72%), #FFFBEE;
  border:1.5px solid #F2E2BC;
}
.cfsum--ok::before,
.everyone::before{
  content:"";position:absolute;left:-16px;top:50%;width:74px;height:74px;margin-top:-37px;
  background:
    conic-gradient(from 0deg, rgba(255,212,102,.62) 0 7deg, rgba(255,212,102,0) 7deg 30deg,
                              rgba(255,212,102,.62) 30deg 37deg, rgba(255,212,102,0) 37deg 60deg,
                              rgba(255,212,102,.62) 60deg 67deg, rgba(255,212,102,0) 67deg 90deg,
                              rgba(255,212,102,.62) 90deg 97deg, rgba(255,212,102,0) 97deg 120deg,
                              rgba(255,212,102,.62) 120deg 127deg, rgba(255,212,102,0) 127deg 150deg,
                              rgba(255,212,102,.62) 150deg 157deg, rgba(255,212,102,0) 157deg 180deg,
                              rgba(255,212,102,.62) 180deg 187deg, rgba(255,212,102,0) 187deg 210deg,
                              rgba(255,212,102,.62) 210deg 217deg, rgba(255,212,102,0) 217deg 240deg,
                              rgba(255,212,102,.62) 240deg 247deg, rgba(255,212,102,0) 247deg 270deg,
                              rgba(255,212,102,.62) 270deg 277deg, rgba(255,212,102,0) 277deg 300deg,
                              rgba(255,212,102,.62) 300deg 307deg, rgba(255,212,102,0) 307deg 330deg,
                              rgba(255,212,102,.62) 330deg 337deg, rgba(255,212,102,0) 337deg 360deg);
  -webkit-mask-image:radial-gradient(circle, rgba(0,0,0,0) 26%, #000 30%, #000 62%, rgba(0,0,0,0) 78%);
  mask-image:radial-gradient(circle, rgba(0,0,0,0) 26%, #000 30%, #000 62%, rgba(0,0,0,0) 78%);
  pointer-events:none;
}
.cfsum--ok > *,
.everyone > *{position:relative;z-index:1}

/* ---- DELIGHT 2: the gold bar flip gets a shimmer ----------- */
.bar--gold .bar__fill{
  background:
    linear-gradient(102deg, rgba(255,255,255,0) 28%, rgba(255,255,255,.26) 47%, rgba(255,255,255,0) 66%),
    linear-gradient(180deg,#F2B437 0%,var(--honey) 100%);
  background-repeat:no-repeat,no-repeat;
  background-size:42% 100%, 100% 100%;
  background-position:96% 0, 0 0;
  box-shadow:inset 0 -2px 0 rgba(150,96,4,.22);
}
.sparks{width:26px;height:24px}
.sparks i:nth-child(1){box-shadow:0 0 6px rgba(255,212,102,.9)}

/* cooking keeps its candy-stripe — it must never read as "ready" */
.bar--gold.bar--cooking .bar__fill{
  background:repeating-linear-gradient(115deg,#F2B437 0 12px,#E8A317 12px 24px);
  opacity:.72;
}

/* ---- DELIGHT 3: the class-film CTA glows ------------------- */
.cffoot .btn--primary:not([disabled]),
.rowact .btn--primary{
  box-shadow:0 0 0 4px rgba(255,212,102,.34), 0 2px 3px rgba(150,96,4,.22), 0 16px 26px -12px rgba(232,163,23,.72);
}

/* ---- RADICAL SIMPLICITY: touch targets never under 48px ---- */
.iconbtn{width:48px;height:48px;border-radius:16px}
.btn--md{height:48px}
.btn--sm{height:40px}
.watch{min-height:44px;display:inline-flex;align-items:center}
.face__av{cursor:pointer}
.lb__ic{width:48px;height:48px;border-radius:16px}

/* ---- bigger primary numbers -------------------------------- */
.chip{font-size:14px;font-weight:800;min-height:30px;padding:0 13px}
.chip--gold{font-size:15px}


/* ---- empty state: the mascot does the encouraging ---------- */
.emptyhint{
  display:flex;align-items:center;gap:8px;margin:9px 0 0;
  font-size:12.5px;font-weight:700;color:var(--ink-35);
}
.emptyhint svg{flex:none;opacity:.9}


/* ---- tokens: photo vignette library ------------------------ */
.scenegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.scenecell{margin:0}
.scenecell__ph{
  aspect-ratio:4/3;background:#FFFDF6;padding:5px;border-radius:16px;
  box-shadow:var(--sh-photo);overflow:hidden;
}
.scenecell__ph svg{width:100%;height:100%;display:block;border-radius:11px}
.scenecell figcaption{
  margin-top:9px;font-size:11px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-35);
}
.scenecrops{display:flex;gap:22px;align-items:flex-end;margin-top:26px;padding-top:22px;border-top:1px solid var(--sand-line)}
.scenecrops figure{margin:0}
.sc{background:#FFFDF6;padding:5px;border-radius:16px;box-shadow:var(--sh-photo);overflow:hidden}
.sc svg{width:100%;height:100%;display:block;border-radius:11px}
.sc--full{width:230px;aspect-ratio:4/3}
.sc--sq{width:132px;aspect-ratio:1/1}
.sc--tall{width:110px;aspect-ratio:9/16}
.scenecrops figcaption{margin-top:9px;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-35)}
@media (max-width:900px){.scenegrid{grid-template-columns:repeat(2,1fr)}}

<body>
<div class="canvas">
  <header class="specbar">
    <div class="specbar__in">
      <div class="brandlock" id="brandlock"></div>
      <nav class="tabs" id="tabs"></nav>
    </div>
  </header>
  <main class="stage" id="stage"></main>
</div>

<script>
/* ============================================================
   POTATO SNAPS — CLASSROOM VIGNETTES
   Scene canvas: 160 x 120 (4:3 landscape, like a real phone photo)
   Hero subject lives inside x 50..112 so a 9:16 centre-crop still works.
   Floor line: y = 88.  Everything sits ON the floor.
   ============================================================ */

var SKIN = ['#F7D0AA','#EDB78C','#D2965F','#A9714A','#82523A','#FBE0C6'];
var HAIR = ['#35251C','#5E3B22','#94612F','#C99244','#EBCE87','#1E1715','#7A4A2B','#D8B26A'];
var SHIRT= ['#8FCBEC','#E8A317','#FF8A78','#77C6A4','#B49BE0','#FFD466','#5FAAD4','#F2907E','#6FBFD6','#FFB37A'];
var PANTS= ['#4E7098','#3E93C4','#C9860B','#7A6A9E','#5B8A6B','#B5603F'];

function pick(a, i){ return a[Math.abs(i) % a.length]; }

/* ---- soft contact shadow under an object ---------------- */
function shadow(cx, cy, rx, ry, op){
  /* three stacked ellipses fake a soft blur far more cheaply than an SVG filter
     (these render 100+ times per spec sheet) */
  ry = ry || rx * 0.26; op = op || 0.13;
  return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(rx*1.24)+'" ry="'+(ry*1.5)+'" fill="#23395B" opacity="'+(op*0.30).toFixed(3)+'"/>'
       + '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(rx*1.09)+'" ry="'+(ry*1.2)+'" fill="#23395B" opacity="'+(op*0.42).toFixed(3)+'"/>'
       + '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="#23395B" opacity="'+(op*0.62).toFixed(3)+'"/>';
}

/* ---- a chunky kindergarten child ------------------------
   o: x (centre), y (floor), h (total height), skin, hair, shirt, pants,
      face: 'back'|'left'|'right'|'front', armL / armR: angle-ish presets,
      hairStyle: 0 bowl, 1 bunches, 2 curls, 3 short, 4 ponytail
---------------------------------------------------------- */
function kid(o){
  var x = o.x, fy = o.y, h = o.h || 48;
  var sk = o.skin  || SKIN[0], hr = o.hair || HAIR[0];
  var sh = o.shirt || SHIRT[0], pt = o.pants || PANTS[0];
  var face = o.face || 'front';
  var hd = h * 0.315;                 // head radius*2
  var hr_ = hd / 2;
  var hy = fy - h + hr_;              // head centre
  var neck = hy + hr_ * 0.86;
  var legH = h * 0.24;
  var bodyTop = neck - 1;
  var bodyBot = fy - legH;
  var bw = h * 0.30;                  // body half-width*2
  var s = '';

  s += shadow(x + h*0.03, fy + 1.2, bw * 0.92, bw * 0.28, 0.16);

  /* legs */
  var lw = bw * 0.30;
  s += '<rect x="'+(x - bw*0.44)+'" y="'+(bodyBot - 2)+'" width="'+lw+'" height="'+(legH + 2)+'" rx="'+(lw/2)+'" fill="'+pt+'"/>';
  s += '<rect x="'+(x + bw*0.44 - lw)+'" y="'+(bodyBot - 2)+'" width="'+lw+'" height="'+(legH + 2)+'" rx="'+(lw/2)+'" fill="'+pt+'"/>';
  /* shoes */
  s += '<rect x="'+(x - bw*0.50)+'" y="'+(fy - legH*0.30)+'" width="'+(lw*1.30)+'" height="'+(legH*0.34)+'" rx="'+(legH*0.17)+'" fill="#3A4C6B"/>';
  s += '<rect x="'+(x + bw*0.50 - lw*1.30)+'" y="'+(fy - legH*0.30)+'" width="'+(lw*1.30)+'" height="'+(legH*0.34)+'" rx="'+(legH*0.17)+'" fill="#3A4C6B"/>';

  /* torso — slight A-line, like a smock */
  var tTop = bodyTop, tBot = bodyBot + 1.5;
  s += '<path d="M'+(x - bw*0.42)+' '+tTop
     + ' Q'+x+' '+(tTop - bw*0.13)+' '+(x + bw*0.42)+' '+tTop
     + ' L'+(x + bw*0.56)+' '+(tBot - bw*0.18)
     + ' Q'+(x + bw*0.56)+' '+tBot+' '+(x + bw*0.40)+' '+tBot
     + ' L'+(x - bw*0.40)+' '+tBot
     + ' Q'+(x - bw*0.56)+' '+tBot+' '+(x - bw*0.56)+' '+(tBot - bw*0.18)
     + ' Z" fill="'+sh+'"/>';
  /* torso shading + highlight */
  s += '<path d="M'+(x + bw*0.14)+' '+tTop+' L'+(x + bw*0.42)+' '+tTop
     + ' L'+(x + bw*0.56)+' '+(tBot - bw*0.18)
     + ' Q'+(x + bw*0.56)+' '+tBot+' '+(x + bw*0.40)+' '+tBot
     + ' L'+(x + bw*0.20)+' '+tBot+' Z" fill="#23395B" opacity=".07"/>';
  s += '<rect x="'+(x - bw*0.34)+'" y="'+(tTop + 1)+'" width="'+(bw*0.22)+'" height="'+((tBot-tTop)*0.42)+'" rx="'+(bw*0.11)+'" fill="#FFFFFF" opacity=".16"/>';

  /* arms */
  var aw = bw * 0.235, aTop = tTop + bw * 0.10;
  var armLen = (tBot - tTop) * 0.78;
  function arm(side, mode){
    var ax = x + side * bw * 0.50;
    if (mode === 'up'){
      return '<rect x="'+(ax - aw/2)+'" y="'+(aTop - armLen*0.72)+'" width="'+aw+'" height="'+(armLen*1.02)+'" rx="'+(aw/2)+'" fill="'+sh+'" transform="rotate('+(side*22)+' '+ax+' '+aTop+')"/>'
           + '<circle cx="'+(ax + side*armLen*0.30)+'" cy="'+(aTop - armLen*0.60)+'" r="'+(aw*0.62)+'" fill="'+sk+'"/>';
    }
    if (mode === 'out'){
      return '<rect x="'+(ax - aw/2)+'" y="'+(aTop - aw/2)+'" width="'+(armLen*0.95)+'" height="'+aw+'" rx="'+(aw/2)+'" fill="'+sh+'" transform="'+(side<0?'scale(-1,1) translate('+(-2*ax)+',0)':'')+'"/>'
           + '<circle cx="'+(ax + side*armLen*0.92)+'" cy="'+(aTop)+'" r="'+(aw*0.62)+'" fill="'+sk+'"/>';
    }
    /* down */
    return '<rect x="'+(ax - aw/2)+'" y="'+aTop+'" width="'+aw+'" height="'+armLen+'" rx="'+(aw/2)+'" fill="'+sh+'" transform="rotate('+(side*9)+' '+ax+' '+aTop+')"/>'
         + '<circle cx="'+(ax + side*armLen*0.16)+'" cy="'+(aTop + armLen*0.98)+'" r="'+(aw*0.60)+'" fill="'+sk+'"/>';
  }
  s += arm(-1, o.armL || 'down');
  s += arm( 1, o.armR || 'down');

  /* neck */
  s += '<rect x="'+(x - hd*0.14)+'" y="'+(neck - hd*0.22)+'" width="'+(hd*0.28)+'" height="'+(hd*0.30)+'" fill="'+sk+'"/>';

  /* head */
  s += '<circle cx="'+x+'" cy="'+hy+'" r="'+hr_+'" fill="'+sk+'"/>';
  s += '<path d="M'+(x - hr_)+' '+hy+' A'+hr_+' '+hr_+' 0 0 0 '+(x + hr_)+' '+hy
     + ' L'+(x + hr_)+' '+(hy - 0.4)+' Z" fill="#23395B" opacity=".05"/>';

  /* hair */
  var hs = (o.hairStyle == null) ? 0 : o.hairStyle;
  if (hs === 0){ /* bowl */
    s += '<path d="M'+(x - hr_*1.03)+' '+(hy + hr_*0.08)
       + ' A'+(hr_*1.03)+' '+(hr_*1.03)+' 0 0 1 '+(x + hr_*1.03)+' '+(hy + hr_*0.08)
       + ' L'+(x + hr_*0.98)+' '+(hy + hr_*0.20)
       + ' Q'+x+' '+(hy - hr_*0.10)+' '+(x - hr_*0.98)+' '+(hy + hr_*0.20)+' Z" fill="'+hr+'"/>';
  } else if (hs === 1){ /* bunches */
    s += '<path d="M'+(x - hr_*1.02)+' '+(hy + hr_*0.02)+' A'+(hr_*1.02)+' '+(hr_*1.02)+' 0 0 1 '+(x + hr_*1.02)+' '+(hy + hr_*0.02)+' Z" fill="'+hr+'"/>';
    s += '<circle cx="'+(x - hr_*1.05)+'" cy="'+(hy + hr_*0.16)+'" r="'+(hr_*0.44)+'" fill="'+hr+'"/>';
    s += '<circle cx="'+(x + hr_*1.05)+'" cy="'+(hy + hr_*0.16)+'" r="'+(hr_*0.44)+'" fill="'+hr+'"/>';
  } else if (hs === 2){ /* curls */
    s += '<circle cx="'+(x - hr_*0.62)+'" cy="'+(hy - hr_*0.60)+'" r="'+(hr_*0.46)+'" fill="'+hr+'"/>';
    s += '<circle cx="'+x+'" cy="'+(hy - hr_*0.84)+'" r="'+(hr_*0.50)+'" fill="'+hr+'"/>';
    s += '<circle cx="'+(x + hr_*0.62)+'" cy="'+(hy - hr_*0.60)+'" r="'+(hr_*0.46)+'" fill="'+hr+'"/>';
    s += '<circle cx="'+(x - hr_*0.92)+'" cy="'+(hy - hr_*0.10)+'" r="'+(hr_*0.36)+'" fill="'+hr+'"/>';
    s += '<circle cx="'+(x + hr_*0.92)+'" cy="'+(hy - hr_*0.10)+'" r="'+(hr_*0.36)+'" fill="'+hr+'"/>';
  } else if (hs === 3){ /* short crop */
    s += '<path d="M'+(x - hr_*1.0)+' '+(hy - hr_*0.05)+' A'+(hr_*1.0)+' '+(hr_*1.0)+' 0 0 1 '+(x + hr_*1.0)+' '+(hy - hr_*0.05)
       + ' Q'+x+' '+(hy - hr_*0.55)+' '+(x - hr_*1.0)+' '+(hy - hr_*0.05)+' Z" fill="'+hr+'"/>';

    s += '<path d="M'+(x - hr_*1.02)+' '+(hy + hr_*0.02)+' A'+(hr_*1.02)+' '+(hr_*1.02)+' 0 0 1 '+(x + hr_*1.02)+' '+(hy + hr_*0.02)+' Z" fill="'+hr+'"/>';
    s += '<path d="M'+(x + hr_*0.85)+' '+(hy - hr_*0.10)+' q'+(hr_*0.85)+' '+(hr_*0.35)+' '+(hr_*0.30)+' '+(hr_*1.25)

  }
  /* hair sheen */
  s += '<ellipse cx="'+(x - hr_*0.34)+'" cy="'+(hy - hr_*0.62)+'" rx="'+(hr_*0.30)+'" ry="'+(hr_*0.16)+'" fill="#FFFFFF" opacity=".22" transform="rotate(-20 '+(x-hr_*0.34)+' '+(hy-hr_*0.62)+')"/>';

  /* face — only when turned toward camera */
  if (face !== 'back'){
    var dx = face === 'left' ? -hr_*0.20 : face === 'right' ? hr_*0.20 : 0;
    var ey = hy + hr_*0.10, esp = hr_*0.32, er = hr_*0.105;
    s += '<circle cx="'+(x + dx - esp)+'" cy="'+ey+'" r="'+er+'" fill="#2B2119"/>';
    s += '<circle cx="'+(x + dx + esp)+'" cy="'+ey+'" r="'+er+'" fill="#2B2119"/>';
    s += '<ellipse cx="'+(x + dx - esp*1.72)+'" cy="'+(ey + hr_*0.20)+'" rx="'+(hr_*0.17)+'" ry="'+(hr_*0.11)+'" fill="#FF7B6B" opacity=".38"/>';
    s += '<ellipse cx="'+(x + dx + esp*1.72)+'" cy="'+(ey + hr_*0.20)+'" rx="'+(hr_*0.17)+'" ry="'+(hr_*0.11)+'" fill="#FF7B6B" opacity=".38"/>';
    s += '<path d="M'+(x + dx - hr_*0.20)+' '+(ey + hr_*0.36)+' q'+(hr_*0.20)+' '+(hr_*0.22)+' '+(hr_*0.40)+' 0" stroke="#2B2119" stroke-width="'+(hr_*0.10)+'" fill="none" stroke-linecap="round"/>';
  }
  return s;
}

var AMB = {
  day : { g:'gDay',  floor:'#E6D4B6', seam:'#D6BF99', rug:'#F3D9A8' },
  warm: { g:'gWarm', floor:'#E9CFA4', seam:'#D8B87F', rug:'#F5C9A0' },

  cool: { g:'gCool', floor:'#DCD6C4', seam:'#C8C0AB', rug:'#E3EEF5' }
};
function room(a, floorY){
  var A = AMB[a]; floorY = floorY || 88;
  return '<rect width="160" height="120" fill="url(#'+A.g+')"/>'
       + '<rect x="0" y="'+floorY+'" width="160" height="'+(120-floorY)+'" fill="'+A.floor+'"/>'

       + '<rect x="0" y="'+floorY+'" width="160" height="7" fill="url(#gFloorShade)"/>';
}
function finish(){
  return '<rect width="160" height="120" fill="url(#gLightTL)"/>'
       + '<rect width="160" height="120" fill="url(#gVig)"/>';
}

function bar(state, count){
  var pct = Math.max(0, Math.min(1, count/8))*100;
  var cls = 'bar' + (state==='empty' ? ' bar--empty' : '')
          + (state==='ready'||state==='done' ? ' bar--gold' : '')
          + (state==='cooking' ? ' bar--gold bar--cooking' : '');
  var ticks = '<div class="bar__ticks">'+Array(8).join('x').split('x').map(function(){return '<i></i>'}).join('')+'</div>';
  return '<div class="'+cls+'">'
    + (state==='empty' ? '' : '<div class="bar__fill" style="width:'+pct+'%"></div>')
    + ticks + '</div>';
}
function chip(state, count){
  if(state==='empty') return '<div class="chip chip--zero">0/8</div>';
  if(count < 8) return '<div class="chip">'+count+'/8</div>';
  return '<div class="chip chip--gold">'+I.check(11,'#23395B',3.6)+' '+count+'</div>';
}

function rosterRow(k, i){
  var extra = '';
  if(k.s==='ready'){
    extra = '<div class="rowact"><button class="btn btn--primary btn--md" style="width:100%">'+I.film(19)+' Make montage</button></div>';
  } else if(k.s==='cooking'){
    extra = '<div class="status status--gold">'
      + '<div class="status__t">Cooking your montage…</div>'
      + '<div class="dots"><i></i><i></i><i></i></div>'
      + '<div class="status__m">~2 min</div></div>';
  } else if(k.s==='done'){
    extra = '<div class="status">'
      + '<div class="tick">'+I.check(12,'#23395B',3.6)+'</div>'
      + '<div class="status__t">Sent to parents</div>'
      + '<div class="watch">'+I.play(13,'#C9860B')+' Watch</div></div>';
  } else if(k.s==='empty'){
    extra = '<div class="emptyhint">'+mascot(30,{camera:false,shadow:false})
      + '<span>No photos yet</span></div>';
  }
  var rowcls = 'row' + (k.s==='ready' ? ' row--ready' : '') + (k.s==='empty' ? ' row--empty' : '');
  var sparks = k.s==='ready' ? '<div class="sparks"><i></i><i></i><i></i></div>' : '';
  return '<div class="'+rowcls+'">'
    + av(k.n, i)
    + '<div class="row__body">'
      + '<div class="row__head"><h3 class="row__name">'+k.n+'</h3>'+sparks+chip(k.s,k.c)+'</div>'
      + bar(k.s, k.c)

}

var CFPHOTOS = (function(){
  var out = [], unstar = {3:1,7:1,12:1,16:1,19:1,23:1};
  var omar = {3:1,12:1,19:1}, yuki = {7:1,16:1};
  for(var k=0;k<24;k++){
    var step = (k*5+3) % 22, n = 2 + (k % 3), tags = [];

/* photos of the week — a stable, varied scene per index */
var PHOTO_ORDER = ['blocks','easel','story','playground','hands','snack','music','sand','birthday','reading','garden','dressup',
                   'playground','blocks','reading','easel','sand','story','snack','hands','music','garden','dressup','birthday'];
function photoScene(i){ return PHOTO_ORDER[Math.abs(i) % PHOTO_ORDER.length]; }
function thumbArt(i){ return scene(photoScene(i), 'sq'); }

function cfItems(o){
  var sel = {}; for(var k in CFBASE) sel[k]=CFBASE[k];
  if(o.sel) for(var k2 in o.sel) sel[k2]=o.sel[k2];
  var exc = o.excused || [];
  var items = CLASS22.map(function(n,i){
    return { n:n, i:i, c:sel[n], st: exc.indexOf(n)>=0 ? 'exc' : (sel[n]>0 ? 'cov' : 'miss') };
  });
  var rank = {miss:0, exc:1, cov:2};
  items.sort(function(a,b){ return rank[a.st]-rank[b.st] || (a.n<b.n?-1:1); });
  /* the focused chip pins to the front while a filter is on, so it never scrolls away */
  if(o.filter){
    var fi = -1;
    items.forEach(function(x,i){ if(x.n===o.filter) fi=i; });
    if(fi>0) items.unshift(items.splice(fi,1)[0]);
  }
  return items;
}
function cfChip(it, filter){
  var cls = 'cchip cchip--'+it.st + (filter===it.n ? ' cchip--filter' : '');
  var badge = it.st==='exc'
    ? '<div class="cchip__b">zzz</div>'
    : '<div class="cchip__b">'+it.c+'</div>';
  return '<div class="'+cls+'"><div class="cchip__w">'
    + '<div class="cchip__av" style="background:'+TINT[it.i%TINT.length]+'">'+it.n.charAt(0)+'</div>'
    + badge + '</div><div class="cchip__n">'+it.n+'</div></div>';
}
function faceDots(tags){
  var show = tags.slice(0,3).map(function(n){
    return '<i style="background:'+tintOf(n)+'"></i>';
  }).join('');
  return '<div class="pth__faces">'+show
    + '<span>'+(tags.length>3 ? '+'+(tags.length-3) : tags.length)+'</span></div>';
}
function cfGrid(o){
  var filter = o.filter;
  var list = [];
  CFPHOTOS.forEach(function(p,i){
    if(filter && p.tags.indexOf(filter)<0) return;
    var on = p.on;
    if(o.starOn && o.starOn.indexOf(i)>=0) on = true;
    list.push({p:p,i:i,on:on});
  });
  var html = '', day = null;
  list.forEach(function(x){
    if(x.p.day !== day){ day = x.p.day; html += '</div><div class="daylabel">'+day+'</div><div class="pgrid">'; }
    html += '<div class="pth'+(x.on?' pth--on':'')+'">' + thumbArt(x.i)
      + '<div class="pth__star">'+I.star(15, x.on?'#23395B':'rgba(35,57,91,.45)', x.on)+'</div>'
      + faceDots(x.p.tags) + '</div>';
  });
  html = (html + '</div>').replace(/^<\/div>/,'');
  if(filter){
    html += '<div class="filternote">That’s every photo of '+filter+' this week.'
      + '<small>Star one and '+filter+' joins the film.</small></div>';
  }
  return html;
}

    return '<button class="tab'+(t.id===state.tab?' on':'')+(t.v11?' tab--new':'')+'" data-tab="'+t.id+'">'
      + '<span class="n">'+t.n+'</span>'+t.label
      + (t.v11 ? '<span class="v">v1.1</span>' : '') + '</button>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){
    b.addEventListener('click', function(){ state.tab = b.dataset.tab; renderTabs(); renderStage(); window.scrollTo(0,0); });
  });
}
function renderStage(){
  var t = TABS.filter(function(x){return x.id===state.tab})[0];
  var head = '<div class="stage__head">'
    + '<p class="stage__eyebrow">'+t.eyebrow+'</p>'
    + '<h2 class="stage__title">'+t.title+'</h2>'
    + '<p class="stage__sub">'+t.sub+'</p></div>';
  var notes = t.notes.map(function(n){
    return '<div class="note"><h3><span class="dot"></span>'+n[0]+'</h3><ul>'
      + n.slice(1).map(function(li){return '<li>'+li+'</li>'}).join('') + '</ul></div>';
  }).join('');
  var body;
  if(t.frames){
    var fr = t.frames();
    body = '<div class="frames">' + fr.map(function(f,i){
        return '<figure class="fr"><figcaption class="fr__cap"><b>'+String.fromCharCode(65+i)+'</b>'
          + '<span>'+f.cap+'</span></figcaption>'
          + '<div class="fr__screen'+(t.frameH?' fr__screen--fixed':'')+'"'
          + (t.frameH?' style="height:'+t.frameH+'px"':'')+'>'+f.html+'</div></figure>';
      }).join('') + '</div>'
      + (notes ? '<div class="notes notes--wide">'+notes+'</div>' : '');
  } else if(t.device){
    body = '<div class="split"><div class="devicewrap"><div class="device"><div class="device__screen">'
      + t.render() + '</div><div class="device__cap">iPhone · 390 × 844</div></div></div>'
      + '<div class="notes">'+notes+'</div></div>';
  } else {
    body = t.render();
  }
  document.getElementById('stage').innerHTML = head + body;
}
document.body.insertAdjacentHTML('afterbegin', sceneDefs());
renderBrand(); renderTabs(); renderStage();
</script>
</body>
</html>
