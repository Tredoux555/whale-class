<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Potato Snaps — Design Spec v1.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   POTATO SNAPS — DESIGN TOKENS
   Philosophy: "Lunchbox Modern" — warmth engineered with precision
   ============================================================ */
:root{
  /* ---- core palette ---- */
  --honey:#E8A317;        /* primary action */
  --honey-deep:#C9860B;   /* honey text on cream, icon strokes */
  --honey-lift:#F5B838;   /* top of the honey gradient */
  --butter:#FFD466;       /* rings, halos, celebration */
  --butter-soft:#FFF0C9;  /* tinted surfaces */
  --butter-mist:#FFF8E6;  /* faintest warm tint */
  --blue:#9ED2F0;         /* progress, parent-side action */
  --blue-deep:#3E93C4;    /* blue text on cream */
  --sky:#EAF6FD;          /* wash surface */
  --cream:#FFFDF6;        /* page */
  --paper:#FFFFFF;        /* card */
  --sand:#F1E7D6;         /* bar track, hairlines */
  --sand-line:#EBDFC9;    /* card hairline */
  --sand-edge:#F5EDDF;    /* card bottom edge (paper thickness) */
  --ink:#23395B;          /* all text */
  --ink-70:rgba(35,57,91,.70);
  --ink-50:rgba(35,57,91,.50);
  --ink-35:rgba(35,57,91,.35);
  --coral:#FF7B6B;        /* destructive only */
  --coral-deep:#D6503F;   /* destructive text/border */
  --leaf:#7FBF8A;         /* micro-accent: greenery inside photos only */

  /* ---- radii ---- */
  --r-card:24px;
  --r-btn:18px;
  --r-chip:999px;
  --r-tile:16px;

  /* ---- shadows: always two layers — tight contact + ambient ---- */
  --sh-card:0 1px 2px rgba(35,57,91,.055), 0 10px 24px -16px rgba(35,57,91,.34);
  --sh-lift:0 2px 4px rgba(35,57,91,.07), 0 18px 34px -18px rgba(35,57,91,.42);
  --sh-gold:0 2px 3px rgba(150,96,4,.20), 0 14px 26px -12px rgba(232,163,23,.62);
  --sh-glow:0 2px 3px rgba(150,96,4,.22), 0 10px 20px -10px rgba(232,163,23,.55), 0 0 0 6px rgba(255,212,102,.30);
  --sh-pol:0 1px 2px rgba(35,57,91,.10), 0 8px 18px -10px rgba(35,57,91,.40);
  --edge:inset 0 -2.5px 0 var(--sand-edge);

  /* ---- paper grain ---- */
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='0.34'/></svg>");

  --disp:'Baloo 2', ui-rounded, system-ui, sans-serif;
  --body:'Nunito', system-ui, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}

/* ============================================================
   SPEC CANVAS CHROME
   ============================================================ */
.canvas{
  min-height:100vh;
  background:
    radial-gradient(1100px 620px at 12% -8%, #FFF3D6 0%, rgba(255,243,214,0) 62%),
    radial-gradient(900px 560px at 96% 4%, #E7F4FD 0%, rgba(231,244,253,0) 60%),
    var(--cream);
}
.canvas::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(35,57,91,.055) 1px, transparent 1px);
  background-size:26px 26px;
  mask-image:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.1));
  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.1));
}
.specbar{position:sticky;top:0;z-index:40;background:rgba(255,253,246,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--sand-line)}
.specbar__in{max-width:1560px;margin:0 auto;padding:14px 28px 12px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brandlock{display:flex;align-items:center;gap:12px;min-width:0}
.brandlock h1{font-family:var(--disp);font-weight:800;font-size:20px;margin:0;letter-spacing:-.01em;line-height:1}
.brandlock p{margin:3px 0 0;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-35)}
.tabs{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap;max-width:1120px;justify-content:flex-end}
.tab{
  font-family:var(--body);font-weight:800;font-size:12.5px;color:var(--ink-70);
  background:transparent;border:1.5px solid transparent;border-radius:999px;
  padding:8px 14px;cursor:pointer;transition:.16s;white-space:nowrap;
}
.tab:hover{background:rgba(35,57,91,.05);color:var(--ink)}
.tab.on{background:var(--ink);color:#FFFDF6;border-color:var(--ink)}
.tab .n{opacity:.45;margin-right:6px;font-family:var(--mono);font-size:10.5px}
.tab.on .n{opacity:.6}

.stage{max-width:1560px;margin:0 auto;padding:38px 28px 96px;position:relative;z-index:1}
.stage__head{margin:0 0 30px;max-width:680px}
.stage__eyebrow{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--honey-deep);margin:0 0 8px;display:flex;align-items:center;gap:10px}
.stage__eyebrow::after{content:"";height:1.5px;flex:1;background:linear-gradient(90deg,var(--butter),rgba(255,212,102,0))}
.stage__title{font-family:var(--disp);font-weight:800;font-size:34px;line-height:1.06;margin:0 0 10px;letter-spacing:-.02em}
.stage__sub{margin:0;font-size:15px;line-height:1.6;color:var(--ink-70);font-weight:600}

.split{display:grid;grid-template-columns:auto 1fr;gap:52px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:1fr;gap:34px}}

/* device frame */
.device{
  width:414px;padding:12px;border-radius:52px;background:var(--paper);
  border:1px solid var(--sand-line);
  box-shadow:0 3px 0 rgba(35,57,91,.05), 0 40px 70px -46px rgba(35,57,91,.55);
  position:relative;
}
.device__screen{width:390px;min-height:844px;border-radius:40px;overflow:hidden;background:var(--cream);position:relative}
.device__cap{position:absolute;left:0;right:0;bottom:-34px;text-align:center;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-35)}
.devicewrap{padding-bottom:44px}

/* multi-frame strip */
.strip{display:flex;gap:34px;align-items:flex-start;flex-wrap:wrap}
.frame{width:390px;flex:none}
.frame__screen{width:390px;height:844px;border-radius:34px;overflow:hidden;background:var(--cream);border:1px solid var(--sand-line);box-shadow:0 3px 0 rgba(35,57,91,.05), 0 30px 56px -40px rgba(35,57,91,.5);position:relative}
.frame__screen--auto{height:auto;min-height:0}
.frame__cap{margin-top:14px;text-align:center}
.frame__cap b{display:block;font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:-.005em}
.frame__cap span{display:block;font-size:12px;font-weight:700;color:var(--ink-50);margin-top:2px;line-height:1.45}
.frame__no{display:inline-block;font-family:var(--mono);font-size:10.5px;color:var(--ink-35);letter-spacing:.1em;margin-bottom:6px}

/* annotation column */
.notes{padding-top:6px;max-width:460px}
.note{margin:0 0 26px}
.note h3{font-family:var(--disp);font-weight:800;font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:9px}
.note h3 .dot{width:9px;height:9px;border-radius:999px;background:var(--honey);flex:none}
.note ul{margin:0;padding:0;list-style:none}
.note li{font-size:13.5px;line-height:1.62;color:var(--ink-70);font-weight:600;padding:0 0 0 20px;margin:0 0 7px;position:relative}
.note li::before{content:"";position:absolute;left:4px;top:9px;width:6px;height:6px;border-radius:2px;background:var(--blue)}
.note li b{color:var(--ink);font-weight:800}
.note code{font-family:var(--mono);font-size:11.5px;background:var(--sky);color:var(--blue-deep);padding:2px 6px;border-radius:6px}

/* ============================================================
   PHONE UI PRIMITIVES
   ============================================================ */
.app{width:100%;min-height:844px;background:var(--cream);position:relative;display:flex;flex-direction:column;overflow:hidden}
.app::after{content:"";position:absolute;inset:0;background-image:var(--grain);background-size:180px 180px;opacity:.2;mix-blend-mode:multiply;pointer-events:none;z-index:60}
.bare .app{min-height:100vh}
.frame__screen .app{min-height:844px;height:100%}
.frame__screen--auto .app{min-height:0;height:auto}
.frame__screen .scroll{overflow:hidden;min-height:0}

.topbar{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,rgba(255,253,246,.97) 62%,rgba(255,253,246,.86));
  backdrop-filter:blur(12px);
  padding:calc(13px + env(safe-area-inset-top)) 18px 12px;
  border-bottom:1px solid var(--sand-line);
  display:flex;align-items:center;gap:12px;
  box-shadow:0 6px 14px -12px rgba(35,57,91,.5);
}
.topbar__txt{min-width:0;flex:1}
.topbar__title{font-family:var(--disp);font-weight:800;font-size:19px;line-height:1.12;margin:0;letter-spacing:-.01em}
.weekpill{display:inline-flex;align-items:center;gap:6px;margin-top:3px;background:var(--sky);color:var(--blue-deep);font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:999px}
.iconbtn{width:48px;height:48px;flex:none;border-radius:16px;border:1.5px solid var(--sand-line);background:var(--paper);display:grid;place-items:center;cursor:pointer;box-shadow:var(--sh-card),var(--edge)}
.iconbtn--sm{width:44px;height:44px;border-radius:14px}
.scroll{flex:1;padding:16px 16px 30px;position:relative;z-index:1}

/* buttons — min touch target 48px */
.btn{font-family:var(--disp);font-weight:800;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;border-radius:var(--r-btn);letter-spacing:-.005em;transition:.15s;position:relative}
.btn--primary{background:linear-gradient(180deg,var(--honey-lift),var(--honey));color:var(--ink);box-shadow:var(--sh-gold),inset 0 -2.5px 0 rgba(150,96,4,.22)}
.btn--glow{box-shadow:var(--sh-glow),inset 0 -2.5px 0 rgba(150,96,4,.22)}
.btn--blue{background:linear-gradient(180deg,#B0DBF4,var(--blue));color:var(--ink);box-shadow:0 2px 3px rgba(35,57,91,.10), 0 14px 26px -14px rgba(62,147,196,.75),inset 0 -2.5px 0 rgba(35,57,91,.10)}
.btn--ghost{background:var(--paper);color:var(--ink);border:1.5px solid var(--sand-line);box-shadow:var(--sh-card),var(--edge)}
.btn--quiet{background:transparent;color:var(--ink-70);border:1.5px solid var(--sand-line);box-shadow:none}
.btn--danger{background:#FFF0ED;color:var(--coral-deep);border:1.5px solid rgba(214,80,63,.28)}
.btn--lg{height:58px;font-size:18px;padding:0 22px;width:100%}
.btn--md{height:50px;font-size:16px;padding:0 18px}
.btn--sm{height:40px;font-size:14px;padding:0 15px;border-radius:13px}
.btn[disabled]{background:var(--sand);color:var(--ink-35);box-shadow:none;cursor:default}

/* camera hero */
.camerabtn{
  width:100%;background:linear-gradient(180deg,var(--honey-lift),var(--honey));border:none;border-radius:var(--r-card);
  padding:16px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;
  box-shadow:var(--sh-gold),inset 0 -3px 0 rgba(150,96,4,.20);text-align:left;position:relative;overflow:hidden;
}
.camerabtn::after{content:"";position:absolute;right:-26px;top:-40px;width:130px;height:130px;border-radius:999px;background:rgba(255,255,255,.18)}
.camerabtn__ic{width:56px;height:56px;flex:none;border-radius:19px;background:rgba(255,255,255,.94);display:grid;place-items:center;box-shadow:0 2px 0 rgba(150,96,4,.16)}
.camerabtn__t{font-family:var(--disp);font-weight:800;font-size:20px;line-height:1.1;color:var(--ink)}
.camerabtn__s{font-family:var(--body);font-weight:700;font-size:12.5px;color:rgba(35,57,91,.68);margin-top:2px}

/* section label */
.seclabel{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 2px 11px}
.seclabel h2{font-family:var(--disp);font-weight:800;font-size:15px;margin:0;letter-spacing:.01em}
.seclabel span{font-size:11.5px;font-weight:800;color:var(--ink-35);letter-spacing:.02em}

/* ---- roster row ---- */
.row{
  background:var(--paper);border:1.5px solid var(--sand-line);border-radius:var(--r-card);
  padding:13px 15px 14px;margin-bottom:11px;
  box-shadow:var(--sh-card),var(--edge);
  display:grid;grid-template-columns:56px 1fr;gap:13px;align-items:start;position:relative;
}
.row--ready{background:linear-gradient(180deg,#FFFBEF 0%,#FFFFFF 60%);border-color:#F2DCA0;box-shadow:var(--sh-lift),inset 0 -2.5px 0 #F7E9C4}
.row--send{background:linear-gradient(180deg,#FFF6DF 0%,#FFFDF4 62%);border-color:#E9C566;box-shadow:0 2px 4px rgba(150,96,4,.10),0 18px 34px -18px rgba(201,134,11,.45),inset 0 -2.5px 0 #F3DDA4}
.row--empty{background:rgba(255,255,255,.55);border-style:dashed;border-color:#E4DAC6;box-shadow:none}
.row__body{min-width:0;padding-top:2px}
.row__head{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.row__name{font-family:var(--disp);font-weight:800;font-size:17.5px;line-height:1;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.row__hint{font-size:12px;font-weight:700;color:var(--ink-35);margin:9px 0 0}

/* avatar */
.av{width:56px;height:56px;border-radius:999px;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:22px;color:var(--ink);box-shadow:0 0 0 3px var(--paper), 0 0 0 5.5px var(--butter), 0 4px 10px -6px rgba(35,57,91,.5);position:relative;overflow:hidden}
.av--sm{width:48px;height:48px;font-size:18px;box-shadow:0 0 0 2.5px var(--paper), 0 0 0 4.5px var(--butter), 0 3px 8px -5px rgba(35,57,91,.5)}
.av--xs{width:36px;height:36px;font-size:14px;box-shadow:0 0 0 2px var(--paper), 0 0 0 3.5px var(--butter)}
.av--lg{width:74px;height:74px;font-size:27px;box-shadow:0 0 0 3px var(--paper), 0 0 0 5px var(--sand), 0 5px 12px -7px rgba(35,57,91,.5)}
.av--none{background:#FAF5EA;color:var(--ink-35);box-shadow:none;border:2px dashed #E0D4BC}
.av--off{filter:grayscale(.8) opacity(.55)}
.av__gloss{position:absolute;inset:0;background:linear-gradient(150deg,rgba(255,255,255,.45),rgba(255,255,255,0) 52%)}

/* count chip */
.chip{font-family:var(--body);font-weight:800;font-size:13px;flex:none;padding:5px 11px;border-radius:999px;background:var(--sand);color:var(--ink-70);line-height:1;white-space:nowrap}
.chip--zero{background:#F6F1E7;color:var(--ink-35)}
.chip--gold{background:linear-gradient(180deg,var(--honey-lift),var(--honey));color:var(--ink);box-shadow:0 1px 0 rgba(150,96,4,.22);display:inline-flex;align-items:center;gap:4px}
.chip--big{font-size:15px;padding:6px 13px}

/* ---- THE BAR ---- */
.bar{height:16px;border-radius:999px;background:var(--sand);position:relative;overflow:hidden;box-shadow:inset 0 1px 2px rgba(35,57,91,.09)}
.bar__fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(180deg,#B2DDF5,var(--blue));box-shadow:inset 0 -2px 0 rgba(35,57,91,.09)}
.bar__ticks{position:absolute;inset:0;display:flex;pointer-events:none}
.bar__ticks i{flex:1;border-right:2px solid rgba(255,255,255,.62)}
.bar__ticks i:last-child{border-right:none}
.bar--empty{background:transparent;box-shadow:none;border:2px dashed #E0D4BC}
.bar--empty .bar__ticks{display:none}
.bar--gold .bar__fill{background:linear-gradient(180deg,var(--honey-lift) 0%,var(--honey) 100%);box-shadow:inset 0 -2px 0 rgba(150,96,4,.24)}
.bar--gold .bar__ticks i{border-right-color:rgba(255,253,246,.5)}
.bar--cooking .bar__fill{background:repeating-linear-gradient(115deg,#F5BB44 0 12px,#E8A317 12px 24px);opacity:.75}

/* celebrate sparkles */
.sparks{position:relative;width:24px;height:20px;flex:none;margin-right:1px}
.sparks i{position:absolute;background:var(--butter);border-radius:1.5px}
.sparks i:nth-child(1){width:9px;height:9px;left:0;top:5px;transform:rotate(45deg);border-radius:2px;box-shadow:0 0 8px rgba(255,196,60,1)}
.sparks i:nth-child(2){width:6px;height:6px;left:13px;top:-1px;background:var(--honey);transform:rotate(45deg);border-radius:1.5px}
.sparks i:nth-child(3){width:4px;height:4px;left:16px;top:13px;background:var(--honey);opacity:.7;transform:rotate(45deg);border-radius:1px}

/* row action / status */
.rowact{margin-top:11px}
.status{margin-top:11px;display:flex;align-items:center;gap:9px;background:var(--sky);border-radius:15px;padding:10px 12px;box-shadow:inset 0 0 0 1px rgba(62,147,196,.13)}
.status--gold{background:var(--butter-soft);box-shadow:inset 0 0 0 1px rgba(201,134,11,.16)}
.status__t{font-size:13.5px;font-weight:800;color:var(--ink);flex:1;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status__m{font-size:12px;font-weight:700;color:var(--ink-50);white-space:nowrap}
.dots{display:inline-flex;gap:3px;align-items:center}
.dots i{width:5px;height:5px;border-radius:999px;background:var(--honey-deep)}
.dots i:nth-child(2){opacity:.6}
.dots i:nth-child(3){opacity:.3}
.tick{width:24px;height:24px;border-radius:999px;background:var(--blue);flex:none;display:grid;place-items:center;box-shadow:0 1px 0 rgba(35,57,91,.12)}
.tick--gold{background:linear-gradient(180deg,var(--honey-lift),var(--honey))}
.watch{font-family:var(--disp);font-weight:800;font-size:13.5px;color:var(--honey-deep);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}

/* ---- polaroid / scrapbook ---- */
.pol{background:var(--paper);padding:6px 6px 6px;border-radius:9px;box-shadow:var(--sh-pol);position:relative;display:block;transform-origin:50% 50%}
.pol__i{border-radius:5px;overflow:hidden;display:block;background:var(--sky);position:relative;line-height:0}
.pol--t1{transform:rotate(-1.8deg)}
.pol--t2{transform:rotate(1.4deg)}
.pol--t3{transform:rotate(-.8deg)}
.pol--t4{transform:rotate(2deg)}
.pol--t5{transform:rotate(.7deg)}
.pol--t6{transform:rotate(-1.3deg)}
.pol--out{filter:grayscale(.78) opacity(.62);box-shadow:0 1px 2px rgba(35,57,91,.08);transform:rotate(0deg) scale(.94);background:#F6F1E7}
.pol__star{position:absolute;right:-7px;top:-7px;width:28px;height:28px;border-radius:999px;background:linear-gradient(180deg,var(--butter),var(--honey));display:grid;place-items:center;box-shadow:0 2px 5px rgba(150,96,4,.34), 0 0 0 2.5px var(--paper);z-index:2}
.pol__star--off{background:rgba(255,253,246,.9);box-shadow:0 1px 3px rgba(35,57,91,.2), 0 0 0 2px var(--paper)}
.pol__tape{position:absolute;left:50%;top:-11px;width:64px;height:21px;margin-left:-32px;background:linear-gradient(180deg,rgba(255,224,140,.86),rgba(255,206,96,.78));transform:rotate(-2.6deg);box-shadow:0 1px 3px rgba(150,96,4,.22);z-index:3;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 6px,#000 calc(100% - 6px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 6px,#000 calc(100% - 6px),transparent 100%)}
.pol__out{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(35,57,91,.86);color:#FFFDF6;font-family:var(--disp);font-weight:800;font-size:12px;padding:5px 14px;border-radius:999px;box-shadow:0 2px 8px rgba(35,57,91,.32);z-index:4;letter-spacing:.03em}
.pol__who{position:absolute;left:0;right:0;bottom:0;display:flex;gap:4px;align-items:center;z-index:2;padding:14px 8px 7px;background:linear-gradient(180deg,rgba(21,39,65,0),rgba(21,39,65,.28))}
.pol__who i{width:15px;height:15px;border-radius:999px;display:block;box-shadow:0 0 0 2px rgba(255,253,246,.96), 0 1px 2px rgba(21,39,65,.35)}

/* ---- tag screen ---- */
.photocard{border-radius:var(--r-card);overflow:hidden;position:relative;border:1.5px solid var(--sand-line);box-shadow:var(--sh-lift);background:var(--sky)}
.photocard__chip{position:absolute;left:12px;top:12px;background:rgba(255,253,246,.94);font-size:11.5px;font-weight:800;color:var(--ink);padding:5px 11px 5px 9px;border-radius:999px;box-shadow:0 2px 8px rgba(35,57,91,.18);display:flex;align-items:center;gap:5px}
.q{font-family:var(--disp);font-weight:800;font-size:24px;margin:20px 2px 14px;letter-spacing:-.015em}

.sw__u{font-size:11.5px;font-weight:700;color:var(--ink-35);margin-top:5px;line-height:1.4}
.typerow{display:flex;align-items:baseline;gap:20px;padding:13px 0;border-bottom:1px dashed var(--sand-line)}
.typerow:last-child{border-bottom:none}
.typerow__s{flex:1;min-width:0;color:var(--ink)}
.typerow__m{font-family:var(--mono);font-size:11px;color:var(--ink-35);text-align:right;white-space:nowrap;line-height:1.6}
.barstates{display:grid;gap:16px}
.barstate{display:grid;grid-template-columns:150px 1fr auto;gap:16px;align-items:center}
.barstate__l{font-size:12.5px;font-weight:800;color:var(--ink-70)}
.barstate__l small{display:block;font-weight:700;color:var(--ink-35);font-size:11px;margin-top:2px}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.shapes{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.shape{text-align:center}
.shape__b{background:var(--butter-soft);border:1.5px solid #F3E2B6;width:92px;height:66px}
.shape__l{font-family:var(--mono);font-size:11px;color:var(--ink-50);margin-top:8px}
.mascotshow{display:flex;gap:36px;align-items:flex-end;flex-wrap:wrap}
.mascotshow figcaption{font-family:var(--mono);font-size:11px;color:var(--ink-35);margin-top:12px;text-align:center}
.mascotshow figure{margin:0}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 16px}
.vgrid figcaption{font-family:var(--mono);font-size:10.5px;color:var(--ink-35);margin-top:10px;text-align:center;letter-spacing:.04em}
.vgrid figure{margin:0}

/* component sheet: row ladder */
.ladder{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:24px}
.ladder__i{background:var(--cream);border-radius:22px;padding:16px;border:1px solid var(--sand-line)}
.ladder__l{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-35);margin:0 0 12px;display:flex;gap:8px;align-items:center}
.ladder__l b{font-family:var(--disp);font-size:13.5px;letter-spacing:-.01em;color:var(--ink);text-transform:none}
.ladder__i .row,.ladder__i .classcard{margin-bottom:0}
.ladder__n{font-size:12px;font-weight:700;color:var(--ink-50);margin:11px 2px 0;line-height:1.45}

/* bare (screenshot) modes */
.bare .specbar,.bare .stage__head,.bare .notes,.bare .device__cap{display:none}
.bare .canvas{background:var(--cream)}
.bare .canvas::before{display:none}
.bare .stage{padding:0;max-width:none}
.bare .device{width:100%;padding:0;border:none;border-radius:0;box-shadow:none}
.bare .device__screen{width:100%;min-height:100vh;border-radius:0}
.bare .devicewrap{padding:0}
.bare .split{display:block}
.strip-mode .specbar{display:none}
.strip-mode .stage{padding:34px 34px 40px;max-width:none}
.strip-mode .notes{display:none}
.strip-mode .split{display:block}
</style>
</head>

var _uid = 0;
function uid(){ return 'g'+(++_uid); }

function kid(x,y,s,o){
  o = o||{};

  g += '<path d="M6 -64 C14.5 -58 19 -46 17.5 -30 L7 -30 Z" fill="#000" opacity=".08"/>';

  /* arms */

    g += '<path d="M15 -57 C25 -66 28 -76 27 -84" stroke="'+sk+'" stroke-width="'+aw+'" stroke-linecap="round" fill="none"/>';
  } else if(arms==='reach'){

    g += '<path d="M-16 -82 C-18 -66 -16 -58 -13 -54 L13 -54 C16 -58 18 -66 16 -82 Z" fill="'+hr+'"/>';

/* ---- light + finish passes ---- */
function light(kind){
  var id = uid(), s='';
  var map = {
    morning:  ['#CFE6F7','.42','#FFF3D9','.20'],
    midday:   ['#FFFFFF','.24','#FFE9B8','.18'],
    golden:   ['#FFD08A','.44','#FF9E5E','.16'],
    overcast: ['#D6DEE8','.46','#FFFFFF','.14'],
    lamp:     ['#FFD9A0','.40','#FFB35C','.20']
  };
  var m = map[kind] || map.midday;
  s += '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0.35" y2="1">'
    + '<stop offset="0" stop-color="'+m[0]+'" stop-opacity="'+m[1]+'"/>'
    + '<stop offset="1" stop-color="'+m[2]+'" stop-opacity="'+m[3]+'"/></linearGradient>'
    + '<radialGradient id="'+id+'v" cx="0.5" cy="0.44" r="0.72">'
    + '<stop offset="0.55" stop-color="#23395B" stop-opacity="0"/>'
    + '<stop offset="1" stop-color="#23395B" stop-opacity="0.22"/></radialGradient></defs>'
    + '<rect width="300" height="300" fill="url(#'+id+')" style="mix-blend-mode:soft-light"/>'
    + '<rect width="300" height="300" fill="url(#'+id+'v)"/>';
  return s;
}
function sunbeam(x,w){
  var id = uid();
  return '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0.4" y2="1">'
   + '<stop offset="0" stop-color="#FFF3CE" stop-opacity=".7"/><stop offset="1" stop-color="#FFF3CE" stop-opacity="0"/></linearGradient></defs>'
   + '<path d="M'+x+' 0 L'+(x+w)+' 0 L'+(x+w+70)+' 300 L'+(x+40)+' 300 Z" fill="url(#'+id+')"/>';
}
function floor(y, c1, c2){
  var id = uid();
  return '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'
   + '<stop offset="0" stop-color="'+c1+'"/><stop offset="1" stop-color="'+c2+'"/></linearGradient></defs>'
   + '<rect x="0" y="'+y+'" width="300" height="'+(300-y)+'" fill="url(#'+id+')"/>'
   + '<rect x="0" y="'+y+'" width="300" height="3" fill="#000" opacity=".07"/>';
}
function wall(c1,c2){
  var id = uid();
  return '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0.2" y2="1">'
   + '<stop offset="0" stop-color="'+c1+'"/><stop offset="1" stop-color="'+c2+'"/></linearGradient></defs>'
   + '<rect width="300" height="300" fill="url(#'+id+')"/>';
}

var SCENE_BG = {
  easel:['#E4EEF6','#D8BE92',212], blocks:['#FBF1DC','#DCEDF8',206],
  playground:['#C6E5F6','#7FBF8A',236], story:['#F6E6CC','#E4A79A',196],

  dressup:['#F3E8DC','#EDD8BB',216], window_:['#DCE6EE','#C8B08C',232]
};
/* portrait render: the square scene, bled top and bottom in its own colours */
function vigTall(kind){
  var f = SCENES[kind] || SCENES.easel;

   + '<rect x="-55" y="'+bg[2]+'" width="410" height="'+(410-80-bg[2])+'" fill="'+bg[1]+'"/>'

/* deterministic scene picker so a given photo id always looks the same */

/* ---- the bar ---- */
function bar(state, count){
  var pct = Math.max(0, Math.min(1, count/8))*100;
  var cls = 'bar' + (state==='empty' ? ' bar--empty' : '')
          + (state==='ready'||state==='done'||state==='send' ? ' bar--gold' : '')
          + (state==='cooking' ? ' bar--gold bar--cooking' : '');
  var ticks = '<div class="bar__ticks">'+new Array(9).join('<i></i>')+'</div>';
  return '<div class="'+cls+'">'
    + (state==='empty' ? '' : '<div class="bar__fill" style="width:'+pct+'%"></div>')
    + ticks + '</div>';
}
function chip(state, count){
  if(state==='empty') return '<div class="chip chip--zero">0/8</div>';
  if(count < 8) return '<div class="chip">'+count+'/8</div>';
  return '<div class="chip chip--gold">'+I.check(12,'#23395B',3.6)+' '+count+'</div>';
}

/* ---- polaroid: the scrapbook unit ---- */
var _tilt = 0;
function polaroid(o){
  o = o||{};
  var tilt = o.tilt===0 ? '' : ' pol--t'+(o.tilt || ((_tilt++ % 6)+1));
  var out = o.out ? ' pol--out' : '';
  var pad = o.pad || 6;
  var ratio = o.ratio || '1/1';
  var who = '';
  if(o.who && o.who.length){
    who = '<div class="pol__who">' + o.who.map(function(c){
      return '<i style="background:'+c+'"></i>';
    }).join('') + '</div>';
  }
  var star = '';
  if(o.star === true)  star = '<div class="pol__star">'+I.star(15,'#23395B')+'</div>';
  if(o.star === false) star = '<div class="pol__star pol__star--off">'+I.starOutline(14,'rgba(35,57,91,.42)')+'</div>';
  return '<div class="pol'+tilt+out+'" style="padding:'+pad+'px">'
    + (o.tape ? '<div class="pol__tape"></div>' : '')
    + star
    + '<div class="pol__i" style="aspect-ratio:'+ratio+'">' + vigAt(o.i||0) + who + '</div>'
    + (o.out ? '<div class="pol__out">Out</div>' : '')
    + '</div>';
}

/* ---- coverage strip: who is in the class film ---- */
function coverage(list, opt){
  opt = opt||{};
  var faces = opt.faces;
  var inN = 0, awayN = 0;
  var cells = list.map(function(k,i){
    var cls = k.st==='in' ? 'on' : (k.st==='away' ? 'away' : 'miss');
    if(k.st==='in') inN++; if(k.st==='away') awayN++;
    if(faces){
      var t = TINT[i % TINT.length];
      var bgv = 'linear-gradient(160deg,'+t[0]+','+t[1]+')';
      return '<i class="'+cls+'" style="background:'+bgv+'">'+k.n.charAt(0)+'</i>';
    }
    return '<i class="'+cls+'"></i>';
  }).join('');
  var total = list.length - awayN;
  return '<div class="cov">'
    + '<div class="cov__top"><div class="cov__n">'+inN+'<span style="font-size:16px;color:var(--ink-35)">/'+total+'</span></div>'
    + '<div class="cov__l">'+(opt.label || 'children in the film')+'</div></div>'
    + '<div class="cov__strip'+(faces?' cov__strip--faces':'')+'">'+cells+'</div></div>';
}

function covList(mode){

function missingFaces(list){
  var out = [];
  list.forEach(function(k,i){ if(k.st==='miss') out.push([k.n,i]); });
  return out;

function classFilmCard(mode){
  var list = covList(mode);
  var miss = missingFaces(list);
  var body = coverage(list, {faces:true, label:'children in the film'});
  var tail;
  if(mode==='all'){
    tail = burst('Everyone\'s in the film', '3 away this week');
  } else if(miss.length){

      + '<div style="display:flex;gap:-6px">'

      + '</div>'
      + '<div class="nudge__t">'+miss.length+' not in a photo yet<small>Tap a face if they\'re away</small></div></div>';
  } else { tail = ''; }

   + '<div class="classcard__t">Everyone together<small>Sunflower Class · Sep 7–11</small></div></div>'

  + '<div class="panel"><div class="panel__h"><h3>Mascot</h3><span>INLINE SVG · 200×200</span><em>Hero on login, 40px in bars, sticker in empty states.</em></div>'
    + '<div class="mascotshow">'
      + '<figure>'+mascot(180)+'<figcaption>full · login 154</figcaption></figure>'
      + '<figure>'+mascot(96)+'<figcaption>96</figcaption></figure>'
      + '<figure>'+mascot(52)+'<figcaption>52</figcaption></figure>'
      + '<figure>'+mascot(40,{shadow:false})+'<figcaption>40 · top bar</figcaption></figure>'
      + '<figure>'+mascot(28,{camera:false,shadow:false})+'<figcaption>28 · camera-free</figcaption></figure>'
      + '<figure>'+mascotSticker(76)+'<figcaption>sticker · empty state</figcaption></figure>'
      + '<figure style="display:flex;gap:14px;align-items:flex-end">'+av('Emma',0)+av('Leo',4)+av('Kai',2)+'</figure>'
    + '</div></div>'
  + '</div>';
}

/* ============================================================
   08 — COMPONENTS
   ============================================================ */
function componentSheet(){
  var cov = [
    ['Gaps', coverage(covList('gap'), {faces:true})],
    ['Everyone in', coverage(covList('all'), {faces:true})],
    ['Dots (compact)', coverage(covList('gap'), {faces:false})]
  ].map(function(c){
    return '<div class="ladder__i"><p class="ladder__l"><b>'+c[0]+'</b></p>'+c[1]+'</div>';
  }).join('');

  var status = [
    ['Cooking','<div class="status status--gold"><div class="status__t">Cooking…</div><div class="dots"><i></i><i></i><i></i></div><div class="status__m">~2 min</div></div>'],
    ['Ready to send','<div class="status status--gold"><div class="tick tick--gold">'+I.check(13,'#23395B',3.6)+'</div><div class="status__t">Film ready</div></div>'],
    ['Sent','<div class="status"><div class="tick">'+I.check(13,'#23395B',3.6)+'</div><div class="status__t">Sent to parents</div><div class="watch">'+I.play(13,'#C9860B')+' Watch</div></div>'],
    ['Away','<div><span class="awaypill">'+I.away(14,'rgba(35,57,91,.5)')+' Away this week</span></div>']
  ].map(function(s){
    return '<div class="ladder__i"><p class="ladder__l"><b>'+s[0]+'</b></p>'+s[1]+'</div>';
  }).join('');

  var moments = [
    ['Sunshine burst', burst('Everyone\'s in the film','3 away this week'), 'Fires once, when coverage completes.'],
    ['Gentle nudge', '<div class="nudge"><div class="burst__ic">'+I.sun(18,'#FFFDF6')+'</div><div class="nudge__t">Films feel best with 8+<small>6 picked — that\'s still fine</small></div></div>', 'Advice, never a block.'],
    ['Hard floor', '<div class="nudge nudge--stop"><div class="burst__ic" style="background:#FF9E8A">'+I.close(18,'#FFFDF6')+'</div><div class="nudge__t">Keep at least 4<small>A film needs 4 photos</small></div></div>', 'The only stop in the product.']
  ].map(function(m){
    return '<div class="ladder__i"><p class="ladder__l"><b>'+m[0]+'</b></p>'+m[1]+'<p class="ladder__n">'+m[2]+'</p></div>';
  }).join('');

  return '<div class="sheet">'
  + '<div class="panel"><div class="panel__h"><h3>Coverage strip</h3><span>3 VARIANTS</span>'
    + '<em>Gold = in the film · dashed = not yet · grey = away. The big number is the whole message.</em></div>'
    + '<div class="ladder">'+cov+'</div></div>'

  + '<div class="panel"><div class="panel__h"><h3>Status lines</h3><span>4 VARIANTS</span>'
    + '<em>Gold = something is happening or waiting on you. Blue = finished and calm.</em></div>'
    + '<div class="ladder">'+status+'</div></div>'

  + '<div class="panel"><div class="panel__h"><h3>Delight moments</h3><span>ONE PER ACHIEVEMENT</span>'
    + '<em>Warmth on arrival, then out of the way. No confetti, no repeats.</em></div>'
    + '<div class="ladder">'+moments+'</div></div>'

  + '<div class="panel"><div class="panel__h"><h3>Filters</h3><span>PILL · 44px</span>'
    + '<em>Counts live inside the chip in mono, so the teacher never has to hunt for the number.</em></div>'
    + '<div class="chips" style="flex-wrap:wrap">'
      + '<button class="fchip on">All <b>64</b></button>'
      + '<button class="fchip">'+I.star(14,'#C9860B')+' Starred <b>12</b></button>'
      + '<button class="fchip">Missing kids <b>9</b></button>'
      + '<button class="fchip">This week <b>64</b></button>'
    + '</div></div>'

  + '<div class="panel"><div class="panel__h"><h3>Avatars &amp; chips</h3><span>56 / 48 / 36 / 74</span>'
    + '<em>Butter ring at every size. Away children desaturate rather than disappear.</em></div>'
    + '<div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap">'
      + av('Emma',0)+av('Leo',4,'av--sm')+av('Kai',2,'av--xs')+av('Mia',6,'av--lg')
      + '<div class="av av--sm av--none">N</div>'
      + av('Zara',1,'av--off')
      + '<div style="display:flex;gap:10px;align-items:center;margin-left:12px">'
        + chip('empty',0)+chip('go',5)+chip('done',11)+'</div>'
    + '</div></div>'

  + '<div class="panel"><div class="panel__h"><h3>Empty states</h3><span>MASCOT AS STICKER</span>'
    + '<em>Never a blank rectangle: a small potato, one line of encouragement, nothing to dismiss.</em></div>'
    + '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px">'
      + '<div class="emptystate">'+mascotSticker(72)+'<p>No photos yet</p><span>Tap the camera to start Zara\'s week.</span></div>'
      + '<div class="emptystate">'+mascotSticker(72)+'<p>Star the best ones</p><span>Starred photos open every film.</span></div>'
      + '<div class="emptystate">'+mascotSticker(72)+'<p>Nothing sent yet</p><span>Films appear here once you send them.</span></div>'
    + '</div></div>'
  + '</div>';
}

/* ============================================================
   BOOT
   ============================================================ */
var params = new URLSearchParams(location.search);
var state = { tab: params.get('tab') || 'board' };
var bare = params.get('bare') === '1';
var stripMode = params.get('strip') === '1';
if(bare) document.body.classList.add('bare');
if(stripMode) document.body.classList.add('strip-mode');

function renderBrand(){
  document.getElementById('brandlock').innerHTML =
    mascot(40,{shadow:false}) + '<div><h1>Potato Snaps</h1><p>Design Spec · v1.3 · Lunchbox Modern</p></div>';
}
function renderTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(function(t){
    return '<button class="tab'+(t.id===state.tab?' on':'')+'" data-tab="'+t.id+'"><span class="n">'+t.n+'</span>'+t.label+'</button>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){
    b.addEventListener('click', function(){ state.tab = b.dataset.tab; renderTabs(); renderStage(); window.scrollTo(0,0); });
  });
}
function renderStage(){
  var t = TABS.filter(function(x){return x.id===state.tab})[0];
  var head = '<div class="stage__head">'
    + '<p class="stage__eyebrow">'+t.eyebrow+'</p>'
    + '<h2 class="stage__title">'+t.title+'</h2>'
    + '<p class="stage__sub">'+t.sub+'</p></div>';
  var notes = (t.notes||[]).map(function(n){
    return '<div class="note"><h3><span class="dot"></span>'+n[0]+'</h3><ul>'
      + n.slice(1).map(function(li){return '<li>'+li+'</li>'}).join('') + '</ul></div>';
  }).join('');
  var body;
  if(t.frames){
    var fr = t.frames.map(function(f,i){
      return '<div class="frame"><div class="frame__screen">'+f.render()+'</div>'
        + '<div class="frame__cap"><span class="frame__no">'+t.n+'.'+(i+1)+'</span>'
        + '<b>'+f.cap+'</b><span>'+f.sub+'</span></div></div>';
    }).join('');
    body = '<div class="strip">'+fr+'</div>'
      + (notes ? '<div class="notes" style="max-width:none;margin-top:46px;column-count:2;column-gap:52px">'+notes+'</div>' : '');
  } else if(t.device){
    body = '<div class="split"><div class="devicewrap"><div class="device"><div class="device__screen">'
      + t.render() + '</div><div class="device__cap">iPhone · 390 × 844</div></div></div>'
      + '<div class="notes">'+notes+'</div></div>';
  } else {
    body = t.render();
  }
  document.getElementById('stage').innerHTML = head + body;
}
renderBrand(); renderTabs(); renderStage();
